<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multiversal — a named voice you put on Grok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --text: #ece8ef;
      --line: #e83d9a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100svh;
      height: 100dvh;
      background: var(--bg);
    }
    .mark {
      position: absolute;
      z-index: 40;
      top: max(28px, env(safe-area-inset-top, 0px));
      left: max(28px, env(safe-area-inset-left, 0px));
      margin: 0;
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 700; /* Syne Bold — logo idea #6 */
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #f4f0f6;
      opacity: 0;
      pointer-events: none;
    }
    .mark.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .mark.animate { animation: fadeMark 1.1s ease 0.85s forwards; }
    .mark .accent {
      color: var(--line);
      opacity: 1;
    }
    .mark .accent:last-child {
      letter-spacing: 0.1em;
      text-transform: none;
      font-size: 0.9em;
      font-weight: 700;
    }
    .promise {
      position: absolute;
      z-index: 40;
      top: max(52px, calc(env(safe-area-inset-top, 0px) + 24px));
      left: max(28px, env(safe-area-inset-left, 0px));
      margin: 0;
      max-width: min(72vw, 420px);
      font-size: clamp(11px, 1.3vw, 13px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: none;
      color: rgba(244, 240, 246, 0.55);
      opacity: 0;
      pointer-events: none;
    }
    .promise.visible { opacity: 1; }
    .promise.animate { animation: fadeMark 1.1s ease 1.05s forwards; }
    .frame:has(#screen2.active) .promise,
    .frame:has(#screen2b.active) .promise {
      opacity: 0 !important;
      visibility: hidden;
    }

    #screen1 {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #screen1.hidden {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .door {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }
    .door.play {
      opacity: 1;
    }
    .door-svg {
      display: block;
      width: min(36vw, 180px);
      height: min(72vh, 560px);
      overflow: visible;
      filter:
        drop-shadow(0 0 10px rgba(232, 61, 154, 0.9))
        drop-shadow(0 0 28px rgba(232, 61, 154, 0.35));
    }
    .door-outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.25;
      stroke-linejoin: miter;
      stroke-linecap: square;
      stroke-dasharray: 720;
      stroke-dashoffset: 720;
    }
    .door-knob {
      fill: var(--line);
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(232, 61, 154, 0.95));
    }
    .door.play .door-outline {
      animation: doorDraw 0.9s cubic-bezier(0.22, 0.9, 0.3, 1) 0.1s forwards;
    }
    .door.play .door-knob {
      animation: doorKnob 0.35s ease 0.85s forwards;
    }
    @keyframes doorDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes doorKnob {
      to { opacity: 1; }
    }
    @keyframes fadeMark {
      from { opacity: 0; }
      to { opacity: 1; }
    }


    #screen2 {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      place-items: center;
      place-content: center;
      opacity: 0;
      background: #000;
      padding: 0 12px max(88px, calc(env(safe-area-inset-bottom, 0px) + 72px));
      overflow-x: clip;
      overflow-y: auto;
    }
    #screen2.active {
      display: grid;
      animation: screenIn 0.6s ease forwards;
    }
    #screen2 > .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 0 max(16px, env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, #000 42%, rgba(0,0,0,0));
    }
    #screen2 > .hint,
    #screen2 > .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    @keyframes screenIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }


    .s2-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      width: min(100%, 420px);
      margin: 0 auto;
      padding: 16px;
      flex: 0 0 auto;
      justify-self: center;
    }
    .stage {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(100%, 420px);
      flex: 0 0 auto;
      min-height: 0;
      align-self: center;
      margin: 0 auto;
      align-items: center;
    }
    .portrait-wrap {
      position: relative;
      width: min(100%, 280px);
      max-width: 280px;
      aspect-ratio: 3 / 4;
      flex: 0 0 auto;
      min-height: 0;
      height: auto;
      margin: 0 auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 0;
      overflow: hidden;
      background: #07070a;
    }
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .personalize {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      padding: 0;
      flex: 0 0 auto;
    }

    .icon-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .tray-btn[aria-pressed="true"] {
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.18);
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.35);
    }
    .tray-slot {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100vw - 24px), 560px);
      z-index: 7;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .tray-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding-top: 8px;
    }
    .tray-panel.open {
      display: flex;
    }
    .tray-panel .chip-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      justify-content: stretch;
      width: 100%;
    }
    .tray-panel .chip-label {
      grid-column: 1 / -1;
      text-align: center;
      width: auto;
    }
    .tray-panel .chip {
      width: 100%;
      min-width: 0;
      text-align: center;
      padding: 8px 6px;
      letter-spacing: 0.08em;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-label {
      width: 100%;
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.45);
    }
    .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(232, 61, 154, 0.06);
      color: rgba(244, 240, 246, 0.88);
      font: 500 11px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 11px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.18);
      color: var(--line);
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.25);
    }
    .chip:hover {
      border-color: var(--line);
    }

    /* Inline chips under the face — same chip size as the open tray panels */
    /* Wider stack on model/verses so chips do not spill right of a 420px column */
    #screen2 .s2-stack,
    #screen2b .s2-stack,
    #screen2 .stage,
    #screen2b .stage {
      width: min(100%, 560px);
    }
    /* Anchor Model/Verses to the bottom-center of the face */
    .personalize.has-inline {
      position: relative;
      width: 100%;
      max-width: 280px; /* same width as .portrait-wrap */
      margin: 0 auto;
      align-items: stretch;
    }
    .inline-tray {
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: min(calc(100vw - 24px), 560px);
      max-width: min(calc(100vw - 24px), 560px);
      margin: 0;
      padding-top: 0;
      box-sizing: border-box;
    }
    .inline-tray .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .inline-tray .chip-label {
      flex: 0 0 100%;
      text-align: center;
      width: 100%;
      margin: 0 0 2px;
    }
    .inline-tray .chip {
      width: auto;
      flex: 0 0 auto;
      min-width: 0;
      text-align: center;
      padding: 8px 11px;
      letter-spacing: 0.08em;
    }
    .inline-tray .chip-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: stretch;
    }
    #screen2b .inline-tray .chip-label {
      flex: none;
      width: 100%;
      text-align: center;
      margin: 0 0 2px;
    }
    #screen2b .chip-line {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      justify-content: stretch;
    }
    #screen2b .chip-line .chip {
      width: 100%;
      flex: none;
      min-width: 0;
      padding: 8px 4px;
      letter-spacing: 0.06em;
    }
    @media (max-width: 520px) {
      #screen2b .chip-line {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      #screen2b .chip-line .chip {
        padding: 9px 4px;
        font-size: 10px;
        letter-spacing: 0.04em;
      }
    }
    #screen2b {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      place-items: center;
      place-content: center;
      opacity: 0;
      background: #000;
      padding: 0 12px max(88px, calc(env(safe-area-inset-bottom, 0px) + 72px));
      overflow-x: clip;
      overflow-y: auto;
    }
    #screen2b.active {
      display: grid;
      animation: screenIn 0.6s ease forwards;
    }
    #screen2b[hidden] { display: none !important; }
    #screen2b > .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 0 max(16px, env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, #000 42%, rgba(0,0,0,0));
    }


    .personality-row {
      /* same chip-row rhythm; MD is the layer under model */
    }
    .md-btn {
      appearance: none;
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--line);
      font: 500 11px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 0;
      cursor: pointer;
    }
    .md-btn:hover,
    .md-btn:focus-visible {
      border-style: solid;
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.1);
      outline: none;
    }
    .md-btn.has-file {
      border-style: solid;
      background: rgba(232, 61, 154, 0.14);
    }
    .md-name {
      font: 400 12px/1.3 Syne, system-ui, sans-serif;
      color: rgba(244, 240, 246, 0.55);
      letter-spacing: 0.04em;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cam-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.88);
      padding: 24px 16px;
    }
    .cam-overlay.open {
      display: flex;
    }
    .cam-overlay video {
      width: min(100%, 360px);
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: #111;
      transform: scaleX(-1);
    }
    .cam-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }


    .side-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .side-input {
      appearance: none;
      width: 100%;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.25);
      color: var(--text);
      font: 400 13px/1.3 Syne, system-ui, sans-serif;
      padding: 11px 12px;
      border-radius: 6px;
      outline: none;
      min-height: 42px;
    }
    .side-input::placeholder { color: rgba(232, 61, 154, 0.55); }
    .side-input:focus {
      border-color: var(--line);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.4);
    }



    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 4px 8px 0;
      gap: 18px;
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
    }
    .photo-btn {
      appearance: none;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(232, 61, 154, 0.06);
      color: var(--line);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .photo-btn:hover,
    .photo-btn:focus-visible {
      border-color: var(--line);
      color: var(--line);
      background: rgba(232, 61, 154, 0.12);
      outline: none;
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.35);
    }
    .photo-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      shape-rendering: geometricPrecision;
    }
    #tray-model {
      width: 52px;
      height: 52px;
    }
    #tray-model svg {
      width: 34px;
      height: 34px;
      stroke-width: 1.4;
    }
    #tray-model svg circle.dot {
      fill: currentColor;
      stroke: none;
    }
    #tray-doors svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }


    .world-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 4px 12px 12px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-left: 0;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }

    #screen2 .controls, #screen2b .controls {
      width: 100%;
      justify-content: center;
      padding-top: 4px;
      flex: 0 0 auto;
    }
    #screen2 .world-btn, #screen2b .world-btn {
      padding: 12px 16px;
    }
    .mail-link {
      position: absolute;
      z-index: 40;
      top: max(28px, env(safe-area-inset-top, 0px));
      right: max(28px, env(safe-area-inset-right, 0px));
      margin: 0;
      font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: rgba(244, 240, 246, 0.42);
      text-decoration: none;
      text-align: right;
      opacity: 0;
      pointer-events: none;
      max-width: min(48vw, 280px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mark.visible ~ .mail-link,
    .frame:has(.mark.visible) .mail-link {
      opacity: 1;
      pointer-events: auto;
    }
    .mail-link:hover,
    .mail-link:focus {
      color: var(--line);
    }
    @media (max-width: 520px) {
      .mail-link {
        top: max(18px, env(safe-area-inset-top, 0px));
        right: max(14px, env(safe-area-inset-right, 0px));
        font-size: 10px;
        letter-spacing: 0.04em;
        max-width: 46vw;
      }
      .mark {
        top: max(18px, env(safe-area-inset-top, 0px));
        left: max(14px, env(safe-area-inset-left, 0px));
        font-size: 12px;
        letter-spacing: 0.2em;
        font-weight: 700;
      }
    }

    #screen2 .screen-title, #screen2b .screen-title {
      width: min(100%, 420px);
      margin: 0 auto;
      text-align: center;
      line-height: 1; /* no empty line-box under YOUR AGENT */
    }
    /* Equal air from the box BORDERS: same margin above and below .portrait-wrap */
    #screen2 .s2-stack,
    #screen2b .s2-stack {
      gap: 0;
    }
    #screen2 .stage,
    #screen2b .stage {
      gap: 0;
    }
    #screen2 .portrait-wrap,
    #screen2b .portrait-wrap {
      margin-top: 20px;
      margin-bottom: 20px;
    }
    #screen2 .personalize.has-inline,
    #screen2b .personalize.has-inline {
      margin-top: 0;
      gap: 0;
    }
    #screen2 .inline-tray .chip-label,
    #screen2b .inline-tray .chip-label {
      margin: 0;
      line-height: 1;
    }
    .nav-pair {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin: 0 auto;
    }
    .world-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .world-btn .arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .world-btn .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    .world-btn:hover:not(:disabled) {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
      filter: none;
    }
    .world-btn:hover:not(:disabled) .arrow {
      transform: translateX(3px);
    }
    .world-btn:disabled {
      opacity: 1;
      color: var(--line);
      cursor: not-allowed;
      text-shadow: none;
    }

    .back-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 12px 12px 4px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }
    .back-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .back-btn .arrow::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 0;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .back-btn .arrow::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-left: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(-45deg);
    }
    .back-btn:hover {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
    }
    .back-btn:hover .arrow {
      transform: translateX(-3px);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .hint {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(236, 232, 239, 0.35);
      min-height: 14px;
      text-align: center;
    }


    
    



    .screen-title {
      position: relative;

      function voiceOf(key) {
        var own = VOICES[key] || {};
        var out = {};
        Object.keys(VOICE_BASE).forEach(function (k) {
          out[k] = own[k] || VOICE_BASE[k];
        });
        return out;
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }
      function handleOf(name) {
        var h = String(name || "agent").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        h = h.replace(/[^a-z0-9]+/g, "");
        return "@" + (h || "agent");
      }
      function siteOf(name) {
        return handleOf(name).slice(1) + ".multiversal.ai";
      }
      function layerLabel() {
        var pressed = document.querySelector(".scenario[aria-pressed='true']");
        if (pressed) {
          var strong = pressed.querySelector("strong");
          if (strong) return strong.textContent;
        }
        if (selectedLayer === "upload") return "Yours";
        return selectedLayer || "Agent";
      }
      function layerKey() {
        return (selectedLayer || "agent").toLowerCase();
      }
      function layerFaceSrc() {
        var pressed = document.querySelector(".scenario[aria-pressed='true']");
        if (pressed) {
          var img = pressed.querySelector("img");
          if (img && img.getAttribute("src")) return img.getAttribute("src");
        }
        return agentFace ? agentFace.getAttribute("src") : "";
      }
      function actLabelOf(act) {
        var acts = wireActs[selectedWire] || wireActs.instagram;
        for (var i = 0; i < acts.length; i++) {
          if (acts[i][0] === act) return acts[i][1];
        }
        return act;
      }
      function actsHtml() {
        var acts = wireActs[selectedWire] || wireActs.instagram;
        var html = '<div class="verse-acts" role="listbox" aria-label="What to do">';
        acts.forEach(function (pair) {
          html += '<button type="button" class="verse-act" data-act="' + esc(pair[0]) + '">' + esc(pair[1]) + "</button>";
        });
        return html + "</div>";
      }
      function bindActs(root) {
        Array.prototype.forEach.call(root.querySelectorAll(".verse-act"), function (btn) {
          btn.addEventListener("click", function () {
            selectedAct = btn.getAttribute("data-act");
            goToScreen8();
          });
        });
      }

      function incoming() {
        return [
          { who: "@lena", text: "this is so you", k: "replySoft" },
          { who: "@miles", text: "when is the next one", k: "replyAsk" },
          { who: "@june", text: "wait this photo", k: "replyLove" }
        ];
      }
      function threadHtml(v) {
        var rows = incoming().map(function (c) {
          return '<div class="thread-row"><p class="who">' + esc(c.who) + '</p><p class="inn">' + esc(c.text) + '</p><p class="out">' + esc(v[c.k]) + "</p></div>";
        }).join("");
        return '<div class="out-sheet"><h2>Replies</h2>' + rows + '<p class="out-status">draft · not sent</p></div>';
      }
      function inboxHtml(v) {
        var rows =
          '<div class="inbox-bucket"><h3>Reply</h3><div class="thread-row"><p class="who">@sam</p><p class="inn">collab on a drop?</p><p class="out">' + esc(v.dmNo) + '</p></div></div>' +
          '<div class="inbox-bucket"><h3>Later</h3><div class="thread-row"><p class="who">@press</p><p class="inn">twenty minutes next week?</p><p class="out">' + esc(v.dmYes) + '</p></div></div>' +
          '<div class="inbox-bucket"><h3>Skip</h3><div class="thread-row"><p class="who">@grid</p><p class="inn">you won a giveaway</p></div></div>';
        return '<div class="out-sheet"><h2>Sorted</h2>' + rows + '<p class="out-status">draft · not sent</p></div>';
      }
      function storyHtml(v) {
        return '<div class="out-sheet"><h2>Story</h2><div class="story-row"><div class="story-frame">' + esc(v.story1) + '</div><div class="story-frame">' + esc(v.story2) + '</div><div class="story-frame">' + esc(v.story3) + '</div></div><p class="out-status">draft · not sent</p></div>';
      }
      function postSheet(title, body) {
        return '<div class="out-sheet"><h2>' + esc(title) + '</h2><p class="out-post">' + esc(body) + '</p><p class="out-status">draft · not sent</p></div>';
      }

      function copyForAct(act, v) {
        if (act === "caption" || act === "hook") return v[act] || v.caption;
        if (act === "post" || act === "quote" || act === "message" || act === "reply" || act === "follow" || act === "note" || act === "draft" || act === "page" || act === "bio" || act === "check" || act === "hash" || act === "standup" || act === "summary") {
          return v[act] || v.post;
        }
        if (act === "sound") return v.sound;
        if (act === "comments" || act === "comment" || act === "thread" || act === "form") {
          return incoming().map(function (c) { return c.who + ": " + c.text + "\n" + v[c.k]; }).join("\n\n");
        }
        if (act === "dms" || act === "inbox" || act === "feed" || act === "file" || act === "mentions" || act === "mint") {
          return "Reply\n@sam: collab on a drop?\n" + v.dmNo + "\n\nLater\n@press: twenty minutes next week?\n" + v.dmYes + "\n\nSkip\n@grid: you won a giveaway";
        }
        if (act === "story") return [v.story1, v.story2, v.story3].join(" · ");
        return v.caption;
      }

      function overlayFor(act, v) {
        if (act === "comments" || act === "comment" || act === "thread") return threadHtml(v);
        if (act === "form") return postSheet("Contact", v.mail);
        if (act === "dms" || act === "inbox" || act === "feed" || act === "file" || act === "mentions" || act === "mint") return inboxHtml(v);
        if (act === "story") return storyHtml(v);
        if (act === "sound") return postSheet("Sound", v.sound);
        if (act === "hook") return postSheet("Video", v.hook);
        if (act === "caption") return postSheet("Caption", v.caption);
        if (act === "bio") return postSheet("Bio", v.bio);
        if (act === "page") return postSheet("Page", v.page);
        if (act === "check") return postSheet("Check", v.check);
        if (act === "hash") return postSheet("Hash", v.hash);
        if (act === "standup") return postSheet("Standup", v.standup);
        if (act === "summary") return postSheet("Summary", v.summary);
        if (act === "mail" || act === "reply") return postSheet("Reply", v.mail);
        if (act === "follow") return postSheet("Follow-up", v.follow);
        if (act === "note" || act === "draft") return postSheet("Note", v.note);
        if (act === "quote") return postSheet("Quote", v.quote);
        if (act === "message") return postSheet("Message", v.slack);
        if (act === "post") return postSheet("Post", v.post);
        return postSheet("Draft", v.caption);
      }

      function faceStage(src, extra, overlay) {
        return '<div class="app-stage"><img class="cover" alt="" src="' + esc(src) + '">' + (extra || "") + (overlay || "") + "</div>";
      }

      function paintApp(root, act) {
        var name = layerLabel();
        var src = layerFaceSrc();
        var handle = handleOf(name);
        var v = voiceOf(layerKey());
        var wire = selectedWire;
        var overlay = act ? overlayFor(act, v) : "";
        var html = "";
        if (wire === "tiktok") {
          html = '<div class="app app-tt">' +
            faceStage(src, '<div class="app-meta"><p class="app-user">' + esc(handle) + '</p><p class="app-sub">' + esc(act ? "" : "tap a job") + '</p><p class="app-sound">' + esc(act === "sound" ? v.sound : ("original sound · " + name.toLowerCase())) + "</p></div>", overlay) +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "instagram") {
          html = '<div class="app app-ig"><div class="app-bar"><span class="dot"><img alt="" src="' + esc(src) + '"></span><strong>' + esc(handle) + '</strong></div>' +
            faceStage(src, act ? "" : '<div class="app-meta"><p class="app-sub">tap a job</p></div>', overlay) +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "x") {
          html = '<div class="app app-x"><div class="app-bar"><span class="dot"><img alt="" src="' + esc(src) + '"></span><strong>' + esc(handle) + '</strong><span> · ' + esc(name) + "</span></div>" +
            '<div class="x-feed">' + (act ? overlay : ('<div class="x-tweet"><span class="from">' + esc(handle) + '</span>tap a job. the draft lands here.</div>')) + "</div>" +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "mail") {
          html = '<div class="app app-mail"><div class="app-bar"><strong>Inbox</strong><span> · ' + esc(name) + "</span></div>" +
            '<div class="mail-list">' + (act ? overlay : ('<div class="mail-item"><span class="from">@press</span>twenty minutes next week?</div><div class="mail-item"><span class="from">@sam</span>collab on a drop?</div><div class="mail-item"><span class="from">@grid</span>you won a giveaway</div>')) + "</div>" +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "slack") {
          html = '<div class="app app-slack"><div class="app-bar"><strong>#multiversal</strong><span> · ' + esc(name) + "</span></div>" +
            '<div class="sl-log">' + (act ? overlay : ('<div class="sl-msg"><span class="from">' + esc(handle) + '</span>here. tap a job.</div>')) + "</div>" +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "linkedin") {
          html = '<div class="app app-li"><div class="app-bar"><span class="dot"><img alt="" src="' + esc(src) + '"></span><strong>' + esc(name) + '</strong><span> · layer</span></div>' +
            faceStage(src, act ? "" : '<div class="app-meta"><p class="app-sub">start a post</p></div>', overlay) +
            (act ? "" : actsHtml()) + "</div>";
        } else if (wire === "inscription") {
          html = '<div class="app app-ord">' +
            faceStage(src, '<p class="ord-id">inscription · ' + esc(handle) + "</p>" + (act ? "" : '<div class="app-meta"><p class="app-sub">tap a job</p></div>'), overlay) +
            (act ? "" : actsHtml()) + "</div>";
        } else {
          html = '<div class="app app-web"><p class="url">' + esc(siteOf(name)) + "</p>" +
            faceStage(src, act ? "" : '<div class="app-meta"><p class="app-user">' + esc(name) + '</p><p class="app-sub">tap a job</p></div>', overlay) +
            (act ? "" : actsHtml()) + "</div>";
        }
        root.innerHTML = html;
        if (!act) bindActs(root);
        if (act) verseCopy = copyForAct(act, v);
        else verseCopy = "";
      }

      function goToScreen7() {
        var model = modelLabel[selectedModel] || selectedModel;
        var door = wireLabel[selectedWire] || selectedWire;
        verseKicker.textContent = model;
        verseName.textContent = door;
        screen7.setAttribute("data-skin", selectedWire || "domain");
        paintApp(verseApp, null);
        showScreen(screen7);
      }
      function goToScreen8() {
        if (!selectedAct) return;
        var door = wireLabel[selectedWire] || selectedWire;
        outKicker.textContent = door;
        outName.textContent = actLabelOf(selectedAct);
        screen8.setAttribute("data-skin", selectedWire || "domain");
        paintApp(outApp, selectedAct);
        showScreen(screen8);
      }
      function finishLayer() {
        if (!selectedLayer && !personalityMd) return;
        goToScreen7();
      }


      document.getElementById("back-3").addEventListener("click", goToScreen2b);
      document.getElementById("back-2b").addEventListener("click", goToScreen2);
      document.getElementById("back-4").addEventListener("click", goToScreen3);
      wordmark.addEventListener("click", function () {
        if (!wordmark.classList.contains("visible")) return;
        goToScreen1();
      });
      wordmark.addEventListener("keydown", function (e) {
        if (!wordmark.classList.contains("visible")) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goToScreen1();
        }
      });
      document.getElementById("back-5").addEventListener("click", goToScreen3);
      document.getElementById("back-6").addEventListener("click", goToScreen3);
      document.getElementById("back-7").addEventListener("click", function () {
        showScreen(lastLayerScreen || screen3);
      });
      document.getElementById("back-8").addEventListener("click", goToScreen7);
      outCopyBtn.addEventListener("click", function () {
        if (!verseCopy) return;
        var restore = outCopyBtn.textContent;
        function done() {
          outCopyBtn.textContent = "Copied";
          setTimeout(function () { outCopyBtn.textContent = restore; }, 1200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(verseCopy).then(done).catch(done);
        } else {
          done();
        }
      });

      worldBtn.addEventListener("click", goToScreen2b);
      document.getElementById("doors-btn").addEventListener("click", goToScreen3);
      document.getElementById("pick-upload").addEventListener("click", function () {
        lastLayerScreen = screen6;
        goToScreen6();
      });
      document.getElementById("pick-celeb").addEventListener("click", function () {
        lastLayerScreen = screen5;
        goToScreen5();
      });
      document.getElementById("pick-skill").addEventListener("click", function () {
        lastLayerScreen = screen4;
        goToScreen4();
      });

      scenarios.forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedLayer = btn.getAttribute("data-layer");
          personalityMd = null;
          scenarios.forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          var grid = btn.closest(".scenario-grid");
          var cont = (grid && grid.id === "celeb-grid") ? celebContinue : skillContinue;
          if (cont) {
            cont.disabled = false;
            cont.setAttribute("aria-disabled", "false");
          }
        });
      });

      skillContinue.addEventListener("click", finishLayer);
      celebContinue.addEventListener("click", finishLayer);
      uploadContinue.addEventListener("click", finishLayer);
    })();
  </script>
