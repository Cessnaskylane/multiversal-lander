<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multiversal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --text: #ece8ef;
      --line: #e83d9a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      background: var(--bg);
    }
    .mark {
      position: absolute;
      z-index: 40;
      top: max(28px, env(safe-area-inset-top, 0px));
      left: max(28px, env(safe-area-inset-left, 0px));
      margin: 0;
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #f4f0f6;
      opacity: 0;
      pointer-events: none;
    }
    .mark.visible { opacity: 1; }
    .mark.animate { animation: fadeMark 1.1s ease 0.85s forwards; }
    .mark .accent {
      color: var(--line);
      opacity: 1;
    }
    .mark .accent:last-child {
      letter-spacing: 0.12em;
      text-transform: none;
      font-size: 0.92em;
    }

    #screen1 {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #screen1.hidden {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .door {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }
    .door.play {
      opacity: 1;
    }
    .door-svg {
      width: min(36vw, 180px);
      height: min(72vh, 560px);
      overflow: visible;
      filter:
        drop-shadow(0 0 10px rgba(232, 61, 154, 0.9))
        drop-shadow(0 0 28px rgba(232, 61, 154, 0.35));
    }
    .door-outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.25;
      stroke-linejoin: miter;
      stroke-linecap: square;
      stroke-dasharray: 720;
      stroke-dashoffset: 720;
    }
    .door-knob {
      fill: var(--line);
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(232, 61, 154, 0.95));
    }
    .door.play .door-outline {
      animation: doorDraw 0.9s cubic-bezier(0.22, 0.9, 0.3, 1) 0.1s forwards;
    }
    .door.play .door-knob {
      animation: doorKnob 0.35s ease 0.85s forwards;
    }
    @keyframes doorDraw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes doorKnob {
      to { opacity: 1; }
    }
    @keyframes fadeMark {
      from { opacity: 0; }
      to { opacity: 1; }
    }


    #screen2 {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      opacity: 0;
      background: #000;
      padding:
        max(64px, calc(env(safe-area-inset-top, 0px) + 48px))
        16px
        max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
      gap: 10px;
      overflow: auto;
    }
    #screen2.active {
      display: flex;
      animation: screenIn 0.6s ease forwards;
    }
    @keyframes screenIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(100%, 420px);
      flex: 1 1 auto;
      min-height: 0;
      align-self: center;
      margin: 0 auto;
      align-items: center;
    }
    .portrait-wrap {
      position: relative;
      width: min(100%, 280px);
      max-width: 280px;
      aspect-ratio: 3 / 4;
      flex: 0 0 auto;
      min-height: 0;
      height: auto;
      margin: 0 auto;
      display: block;
      border: 1px solid rgba(232, 61, 154, 0.85);
      border-radius: 0;
      overflow: hidden;
      background: #07070a;
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.2);
    }
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .personalize {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 0;
      flex: 0 0 auto;
    }

    .icon-tray {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .tray-btn[aria-pressed="true"] {
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.18);
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.35);
    }
    .tray-slot {
      width: 100%;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .tray-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding-top: 2px;
    }
    .tray-panel.open {
      display: flex;
    }
    .tray-panel .chip-row {
      justify-content: center;
    }
    .tray-panel .chip-label {
      text-align: center;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .chip-label {
      width: 100%;
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.45);
    }
    .chip {
      appearance: none;
      border: 1px solid rgba(232, 61, 154, 0.55);
      background: rgba(232, 61, 154, 0.06);
      color: rgba(244, 240, 246, 0.88);
      font: 500 11px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 11px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.18);
      color: var(--line);
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.25);
    }
    .chip:hover {
      border-color: var(--line);
    }

    .personality-row {
      /* same chip-row rhythm; MD is the layer under model */
    }
    .md-btn {
      appearance: none;
      border: 1px dashed rgba(232, 61, 154, 0.7);
      background: transparent;
      color: var(--line);
      font: 500 11px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-radius: 0;
      cursor: pointer;
    }
    .md-btn:hover,
    .md-btn:focus-visible {
      border-style: solid;
      border-color: var(--line);
      background: rgba(232, 61, 154, 0.1);
      outline: none;
    }
    .md-btn.has-file {
      border-style: solid;
      background: rgba(232, 61, 154, 0.14);
    }
    .md-name {
      font: 400 12px/1.3 Syne, system-ui, sans-serif;
      color: rgba(244, 240, 246, 0.55);
      letter-spacing: 0.04em;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cam-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.88);
      padding: 24px 16px;
    }
    .cam-overlay.open {
      display: flex;
    }
    .cam-overlay video {
      width: min(100%, 360px);
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: #111;
      transform: scaleX(-1);
    }
    .cam-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }


    .side-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .side-input {
      appearance: none;
      width: 100%;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.25);
      color: var(--text);
      font: 400 13px/1.3 Syne, system-ui, sans-serif;
      padding: 11px 12px;
      border-radius: 6px;
      outline: none;
      min-height: 42px;
    }
    .side-input::placeholder { color: rgba(232, 61, 154, 0.55); }
    .side-input:focus {
      border-color: var(--line);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.4);
    }



    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 4px 8px 0;
      gap: 18px;
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
    }
    .photo-btn {
      appearance: none;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(232, 61, 154, 0.55);
      background: rgba(232, 61, 154, 0.06);
      color: var(--line);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .photo-btn:hover,
    .photo-btn:focus-visible {
      border-color: var(--line);
      color: var(--line);
      background: rgba(232, 61, 154, 0.12);
      outline: none;
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.35);
    }
    .photo-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      shape-rendering: geometricPrecision;
    }
    #tray-model {
      width: 52px;
      height: 52px;
    }
    #tray-model svg {
      width: 34px;
      height: 34px;
      stroke-width: 1.4;
    }
    #tray-model svg circle.dot {
      fill: currentColor;
      stroke: none;
    }
    #tray-doors svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }


    .world-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 4px 12px 12px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-left: 0;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }

    #screen2 .controls {
      width: min(100%, 420px);
      justify-content: center;
      padding-top: 4px;
      flex: 0 0 auto;
    }
    #screen2 .world-btn {
      padding: 12px 16px;
    }
    #screen2 .screen-title {
      width: min(100%, 420px);
      margin: 0 auto 6px;
      text-align: center;
    }
    .nav-pair {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin: 0 auto;
    }
    .world-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .world-btn .arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .world-btn .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    .world-btn:hover:not(:disabled) {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
      filter: none;
    }
    .world-btn:hover:not(:disabled) .arrow {
      transform: translateX(3px);
    }
    .world-btn:disabled {
      opacity: 1;
      color: var(--line);
      cursor: not-allowed;
      text-shadow: none;
    }

    .back-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 12px 12px 4px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }
    .back-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .back-btn .arrow::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 0;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .back-btn .arrow::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-left: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(-45deg);
    }
    .back-btn:hover {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
    }
    .back-btn:hover .arrow {
      transform: translateX(-3px);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .hint {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(236, 232, 239, 0.35);
      min-height: 14px;
      text-align: center;
    }


    
    



    .screen-title {
      position: relative;
      z-index: 3;
      margin: 0 0 8px;
      width: 100%;
      text-align: center;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.9);
      flex: 0 0 auto;
    }




    #screen4 {
      position: absolute;
      inset: 0;
      z-index: 17;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      padding:
        max(72px, calc(env(safe-area-inset-top, 0px) + 56px))
        20px
        max(96px, calc(env(safe-area-inset-bottom, 0px) + 72px));
      gap: 18px;
      overflow: hidden;
    }
    #screen4.active {
      display: flex;
      animation: screenIn 0.55s ease forwards;
    }
    #screen4[hidden] { display: none !important; }
            .s3-bg {
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(232, 61, 154, 0.06), transparent 60%),
        #000 url("assets/assembled-bg.jpg?v=6") center / 130% no-repeat;
      opacity: 0.32;
      pointer-events: none;
      filter: saturate(1.05) brightness(0.75);
    }
    .s3-head {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.72);
      text-align: center;
    }
    .scenario-grid {
      position: relative;
      z-index: 2;
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      flex: 0 1 auto;
      max-height: min(68dvh, 640px);
      overflow: auto;
      padding: 2px;
    }
    .scenario {
      appearance: none;
      position: relative;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: #0a0a0e;
      color: var(--text);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      display: block;
      min-height: 0;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .scenario:hover {
      border-color: var(--line);
    }
    .scenario[aria-pressed="true"] {
      border-color: var(--line);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.45), 0 0 28px rgba(232, 61, 154, 0.22);
    }
    .scenario-art {
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: #0a0a0e;
    }
    .scenario-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      margin: 0;
      padding: 28px 12px 10px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.35) 55%, transparent 100%);
    }
    .scenario-label strong {
      display: block;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--line);
      margin: 0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
    }
    .layer-custom {
      position: relative;
      z-index: 2;
      width: min(100%, 980px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 auto 10px;
      padding: 0 2px;
      flex: 0 0 auto;
    }
    .layer-custom .chip-label {
      width: 100%;
    }
    .s3-foot {
      position: relative;
      z-index: 2;
      width: min(100%, 980px);
      display: flex;
      justify-content: center;
      padding-top: 4px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      flex: 0 0 auto;
    }

    @media (max-width: 820px) {
      .scenario-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: min(58dvh, 520px);
      }
    }
    @media (max-width: 520px) {
      .scenario-grid {
        grid-template-columns: 1fr;
        max-height: min(54dvh, 480px);
      }
    }

    @media (max-width: 720px) {
      .personalize {
        max-width: 100%;
        padding: 0;
      }
      .portrait-wrap {
        width: min(100%, 230px);
        max-width: 230px;
      }
      .chip {
        padding: 7px 10px;
        font-size: 10px;
      }
      .side-input {
        font-size: 12px;
        padding: 10px;
        min-height: 38px;
      }
      .portrait {
        flex: 1 1 auto;
        max-height: min(46dvh, 400px);
      }
      .portrait-wrap {
        width: min(100%, 230px);
        max-width: 230px;
      }
      .hint {
        display: none;
      }
      .screen-title {
        font-size: 13px;
        letter-spacing: 0.28em;
        margin-bottom: 4px;
      }
      .world-btn {
        min-height: 44px;
        padding: 14px 8px 14px 12px;
      }
      #screen2,
      #screen4 {
        padding-bottom: max(108px, calc(env(safe-area-inset-bottom, 0px) + 88px));
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="mark" id="wordmark"><span class="accent">Multi</span>versal <span class="accent">.ai</span></p>

    <div id="screen1" aria-label="Door">
      <div class="door" id="beam" aria-hidden="true">
        <svg class="door-svg" viewBox="0 0 100 200" aria-hidden="true">
          <rect class="door-outline" x="18" y="12" width="64" height="176" pathLength="720" />
          <circle class="door-knob" cx="70" cy="112" r="2.2" />
        </svg>
      </div>
    </div>

        <div id="screen2" aria-label="Personalize your agent">
      <h1 class="screen-title">Your agent</h1>
      <div class="stage">
      <div class="portrait-wrap">
        <div class="portrait">
          <img id="agent-face" src="assets/agent-face.png?v=2" alt="" />
        </div>
      </div>

      <div class="personalize">
        <div class="icon-tray" role="toolbar" aria-label="Personalize">
          <button type="button" class="photo-btn" id="add-photo" aria-label="Upload face" title="Upload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5V6.5" />
              <path d="M8.2 10.2L12 6.4l3.8 3.8" />
              <path d="M5 18h14" />
            </svg>
          </button>
          <button type="button" class="photo-btn" id="webcam-photo" aria-label="Take photo with camera" title="Camera">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h3.1l1.6-2.3h6.6L16.9 8H20a1.4 1.4 0 0 1 1.4 1.4v8.2A1.4 1.4 0 0 1 20 19H4a1.4 1.4 0 0 1-1.4-1.4V9.4A1.4 1.4 0 0 1 4 8z" />
              <circle cx="12" cy="13.3" r="3.15" />
            </svg>
          </button>
          <button type="button" class="photo-btn tray-btn" id="tray-model" aria-label="Model" title="Model" aria-pressed="false" aria-expanded="false" aria-controls="panel-model">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.2" y="6.2" width="17.6" height="14.6" rx="2.4" />
              <circle class="dot" cx="9.1" cy="13.2" r="1.55" />
              <circle class="dot" cx="14.9" cy="13.2" r="1.55" />
              <path d="M8.4 17.8h7.2" />
              <path d="M12 2.4v3.8" />
              <circle class="dot" cx="12" cy="2.2" r="1.2" />
            </svg>
          </button>
          <button type="button" class="photo-btn tray-btn" id="tray-doors" aria-label="Plugins" title="Plugins" aria-pressed="false" aria-expanded="false" aria-controls="panel-doors">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h10v3.8a2.6 2.6 0 1 1 0 5.4V18h-3.2a2.6 2.6 0 1 0-5.4 0H4V4z" />
            </svg>
          </button>
        </div>

        <div class="tray-slot">
        <div class="tray-panel" id="panel-model" hidden>
          <div class="chip-row" role="group" aria-label="Model">
            <p class="chip-label">Model</p>
            <button type="button" class="chip" data-model="grok" aria-pressed="true">Grok</button>
            <button type="button" class="chip" data-model="gpt" aria-pressed="false">GPT</button>
            <button type="button" class="chip" data-model="gemini" aria-pressed="false">Gemini</button>
            <button type="button" class="chip" data-model="claude" aria-pressed="false">Claude</button>
            <button type="button" class="chip" data-model="deepseek" aria-pressed="false">DeepSeek</button>
          </div>
        </div>

        <div class="tray-panel" id="panel-doors" hidden>
          <div class="chip-row" role="group" aria-label="First door">
            <p class="chip-label">First door</p>
            <button type="button" class="chip" data-wire="domain" aria-pressed="true">Web domain</button>
            <button type="button" class="chip" data-wire="mail" aria-pressed="false">Email</button>
            <button type="button" class="chip" data-wire="x" aria-pressed="false">X.com</button>
            <button type="button" class="chip" data-wire="slack" aria-pressed="false">Slack</button>
            <button type="button" class="chip" data-wire="calendar" aria-pressed="false">Calendar</button>
            <button type="button" class="chip" data-wire="inscription" aria-pressed="false">Blockchain inscription</button>
          </div>
        </div>
        </div>
      </div>
      </div>

      <div class="controls">
        <div class="nav-pair">
          <button type="button" class="world-btn" id="world-btn" aria-disabled="false">Continue</button>
        </div>
      </div>
      <div class="cam-overlay" id="cam-overlay" hidden>
        <video id="cam-video" playsinline muted></video>
        <div class="cam-actions">
          <button type="button" class="back-btn" id="cam-cancel" aria-label="Cancel">Cancel</button>
          <button type="button" class="world-btn" id="cam-capture" aria-label="Capture">Capture <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
      <p class="hint" id="hint"></p>
      <input class="file-input" type="file" accept="image/*" id="file-photo" tabindex="-1" aria-hidden="true" />
    </div>



    <div id="screen4" aria-label="Personality layer" hidden>
      <div class="s3-bg" aria-hidden="true"></div>
      <p class="s3-head">Personality layer</p>
      <div class="layer-custom">
        <p class="chip-label">Custom personality</p>
        <button type="button" class="md-btn" id="add-md" aria-label="Add .md file">Add .md</button>
        <span class="md-name" id="md-name" hidden></span>
        <input class="file-input" type="file" accept=".md,text/markdown,text/plain" id="file-md" tabindex="-1" aria-hidden="true" />
      </div>
      <div class="scenario-grid" id="scenario-grid" role="listbox" aria-label="Specialty personalities">
        <button type="button" class="scenario" role="option" data-layer="companion" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/couch.png?v=2" alt="" />
          <span class="scenario-label"><strong>Companion</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="host" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/dinner.png?v=2" alt="" />
          <span class="scenario-label"><strong>Host</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="pulse" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/concert.png?v=2" alt="" />
          <span class="scenario-label"><strong>Pulse</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="correspondent" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/london.png?v=1" alt="" />
          <span class="scenario-label"><strong>Correspondent</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="muse" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/paris.png?v=1" alt="" />
          <span class="scenario-label"><strong>Muse</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="operator" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/future.png?v=1" alt="" />
          <span class="scenario-label"><strong>Operator</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="guide" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/heaven.png?v=1" alt="" />
          <span class="scenario-label"><strong>Guide</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="adversary" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/hell.png?v=1" alt="" />
          <span class="scenario-label"><strong>Adversary</strong></span>
        </button>
        <button type="button" class="scenario" role="option" data-layer="mediator" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/purgatory.png?v=1" alt="" />
          <span class="scenario-label"><strong>Mediator</strong></span>
        </button>
      </div>
      <div class="s3-foot">
        <div class="nav-pair">
          <button type="button" class="back-btn" id="back-4" aria-label="Back"><span class="arrow" aria-hidden="true"></span> Back</button>
          <button type="button" class="world-btn" id="scenario-continue" disabled aria-disabled="true">Continue <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var screen1 = document.getElementById("screen1");
      var screen2 = document.getElementById("screen2");
      var screen4 = document.getElementById("screen4");
      var wordmark = document.getElementById("wordmark");
      var beam = document.getElementById("beam");
      var worldBtn = document.getElementById("world-btn");
      var addPhoto = document.getElementById("add-photo");
      var filePhoto = document.getElementById("file-photo");
      var hint = document.getElementById("hint");
      var agentFace = document.getElementById("agent-face");
      var selectedModel = "grok";
      var selectedWire = "domain";
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var introMs = reduceMotion ? 200 : 2100;
      var advanced = false;
      var starting = false;
      var photoUrl = null;

      function replayIntro() {
        wordmark.classList.remove("animate", "visible");
        beam.classList.remove("play");
        void wordmark.offsetWidth;
        void beam.offsetWidth;
        if (reduceMotion) {
          wordmark.classList.add("visible");
          beam.classList.add("play");
          return;
        }
        beam.classList.add("play");
        wordmark.classList.add("animate");
      }

      function hideAllScreens() {
        screen2.classList.remove("active");
        screen4.classList.remove("active");
        screen4.hidden = true;
        screen1.classList.add("hidden");
        screen1.setAttribute("aria-hidden", "true");
        screen1.style.display = "none";
      }

      function goToScreen1() {
        screen2.classList.remove("active");
        screen4.classList.remove("active");
        screen4.hidden = true;
        screen1.style.display = "";
        screen1.classList.remove("hidden");
        screen1.removeAttribute("aria-hidden");
        advanced = false;
        starting = false;
        wordmark.classList.remove("animate", "visible");
        beam.classList.remove("play");
        void wordmark.offsetWidth;
        void beam.offsetWidth;
        onStart();
      }

      function goToScreen2() {
        screen4.classList.remove("active");
        screen4.hidden = true;
        screen1.classList.add("hidden");
        screen1.setAttribute("aria-hidden", "true");
        wordmark.classList.remove("animate");
        wordmark.classList.add("visible");
        screen2.classList.add("active");
        advanced = true;
        setTimeout(function () {
          if (advanced) screen1.style.display = "none";
        }, reduceMotion ? 0 : 560);
      }

      function onStart() {
        if (advanced || starting) return;
        starting = true;
        replayIntro();
        setTimeout(goToScreen2, introMs);
      }

      // Page 1 plays on load, then advances
      onStart();

      function setExclusivePressed(buttons, active) {
        buttons.forEach(function (b) {
          b.setAttribute("aria-pressed", b === active ? "true" : "false");
        });
      }

      var modelChips = Array.prototype.slice.call(document.querySelectorAll("[data-model]"));
      modelChips.forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedModel = btn.getAttribute("data-model");
          setExclusivePressed(modelChips, btn);
        });
      });

      var wireChips = Array.prototype.slice.call(document.querySelectorAll("[data-wire]"));
      wireChips.forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedWire = btn.getAttribute("data-wire");
          setExclusivePressed(wireChips, btn);
        });
      });


      var trayModel = document.getElementById("tray-model");
      var trayDoors = document.getElementById("tray-doors");
      var panelModel = document.getElementById("panel-model");
      var panelDoors = document.getElementById("panel-doors");

      function setTrayOpen(which) {
        var openModel = which === "model";
        var openDoors = which === "doors";
        panelModel.hidden = !openModel;
        panelDoors.hidden = !openDoors;
        panelModel.classList.toggle("open", openModel);
        panelDoors.classList.toggle("open", openDoors);
        trayModel.setAttribute("aria-pressed", openModel ? "true" : "false");
        trayModel.setAttribute("aria-expanded", openModel ? "true" : "false");
        trayDoors.setAttribute("aria-pressed", openDoors ? "true" : "false");
        trayDoors.setAttribute("aria-expanded", openDoors ? "true" : "false");
      }

      trayModel.addEventListener("click", function () {
        setTrayOpen(panelModel.classList.contains("open") ? null : "model");
      });
      trayDoors.addEventListener("click", function () {
        setTrayOpen(panelDoors.classList.contains("open") ? null : "doors");
      });

      addPhoto.addEventListener("click", function () {
        filePhoto.click();
      });

      var webcamBtn = document.getElementById("webcam-photo");
      var camOverlay = document.getElementById("cam-overlay");
      var camVideo = document.getElementById("cam-video");
      var camCapture = document.getElementById("cam-capture");
      var camCancel = document.getElementById("cam-cancel");
      var camStream = null;

      function stopCam() {
        if (camStream) {
          camStream.getTracks().forEach(function (tr) { tr.stop(); });
          camStream = null;
        }
        camVideo.srcObject = null;
        camOverlay.classList.remove("open");
        camOverlay.hidden = true;
      }

      function openCam() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          hint.textContent = "camera not available";
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }).then(function (stream) {
          camStream = stream;
          camVideo.srcObject = stream;
          camOverlay.hidden = false;
          camOverlay.classList.add("open");
          return camVideo.play();
        }).catch(function () {
          hint.textContent = "camera permission denied";
        });
      }

      webcamBtn.addEventListener("click", openCam);
      camCancel.addEventListener("click", stopCam);
      camCapture.addEventListener("click", function () {
        if (!camVideo.videoWidth) return;
        var canvas = document.createElement("canvas");
        canvas.width = camVideo.videoWidth;
        canvas.height = camVideo.videoHeight;
        var ctx = canvas.getContext("2d");
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(camVideo, 0, 0);
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        canvas.toBlob(function (blob) {
          if (!blob) return;
          photoUrl = URL.createObjectURL(blob);
          agentFace.src = photoUrl;
          hint.textContent = "face set";
          stopCam();
        }, "image/jpeg", 0.92);
      });

      var addMd = document.getElementById("add-md");
      var fileMd = document.getElementById("file-md");
      var mdName = document.getElementById("md-name");
      var personalityMd = null;
      addMd.addEventListener("click", function () {
        fileMd.click();
      });
      fileMd.addEventListener("change", function () {
        var file = fileMd.files && fileMd.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          personalityMd = String(reader.result || "");
          mdName.textContent = file.name;
          mdName.hidden = false;
          addMd.classList.add("has-file");
          addMd.textContent = ".md added";
          hint.textContent = "custom personality on";
          var sc = document.getElementById("scenario-continue");
          if (sc) {
            sc.disabled = false;
            sc.setAttribute("aria-disabled", "false");
          }
        };
        reader.readAsText(file);
      });

      filePhoto.addEventListener("change", function () {
        var file = filePhoto.files && filePhoto.files[0];
        if (!file) return;
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = URL.createObjectURL(file);
        agentFace.src = photoUrl;
        hint.textContent = "face set";
      });


      var scenarios = Array.prototype.slice.call(document.querySelectorAll(".scenario"));
      var scenarioContinue = document.getElementById("scenario-continue");
      var selectedLayer = null;

      function goToScreen4() {
        screen2.classList.remove("active");
        screen4.hidden = false;
        screen4.classList.add("active");
      }

      document.getElementById("back-4").addEventListener("click", function () {
        goToScreen2();
      });

      worldBtn.addEventListener("click", function () {
        goToScreen4();
      });

      scenarios.forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedLayer = btn.getAttribute("data-layer");
          scenarios.forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          scenarioContinue.disabled = false;
          scenarioContinue.setAttribute("aria-disabled", "false");
        });
      });

      scenarioContinue.addEventListener("click", function () {
        if (!selectedLayer && !personalityMd) return;
        hint.textContent =
          selectedModel +
          (personalityMd ? " · md" : "") +
          " · " + selectedWire +
          (selectedLayer ? " · " + selectedLayer : "");
      });
    })();
  </script>
</body>
</html>
