<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>multiversal — ask every AI at once</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#1b1630;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 20px 48px;
background:radial-gradient(circle at 20% 30%,#c7b8ff88,transparent 25%),radial-gradient(circle at 80% 70%,#9fe3ff88,transparent 28%),radial-gradient(circle at 70% 20%,#ffc6e888,transparent 20%),#f6f4ff;background-attachment:fixed}
.logo{position:fixed;top:28px;left:36px;font-weight:800;font-size:28px;letter-spacing:-1px;text-decoration:none;background:linear-gradient(90deg,#8b7cff,#e879f9,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:56px;font-weight:800;letter-spacing:-1.5px;text-align:center;max-width:900px;line-height:1.1}
.box{margin-top:48px;width:820px;max-width:100%;background:#fffc;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:24px;padding:20px 20px 20px 32px;box-shadow:0 20px 60px #6a5acd22;display:flex;gap:12px;align-items:center}
.box input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:22px;color:#1b1630;outline:none}
.box input::placeholder{color:#9a93b5}
button{background:#1b1630;color:#fff;border:0;border-radius:14px;padding:14px 26px;font:600 17px Inter,sans-serif;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:wait}
.card{display:none;width:900px;max-width:100%;margin-top:32px;background:#fffc;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:24px;padding:28px 32px;box-shadow:0 20px 60px #6a5acd22}
body.answered h1,body.answered .box{display:none}body.answered .card{display:block;margin-top:0}
.q{color:#7a7396;font-size:18px;margin-bottom:14px}
.ans{font-size:26px;line-height:1.45;white-space:pre-wrap}
.bar{height:8px;border-radius:9px;background:#eee;margin:18px 0;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,#7c6cff,#3bc6f2);transition:width .8s}
.agree{font-weight:600;font-size:18px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 10px;border-radius:99px;margin:4px;background:#fff9}
.chip i{width:20px;height:20px;border-radius:50%;color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;font-weight:700}
.y{color:#16a34a}.n{color:#dc2626}
.again{margin-top:20px;background:transparent;color:#1b1630;border:1px solid #1b163033;padding:10px 18px;font-size:15px}
.err{color:#dc2626;margin-top:16px;font-size:15px;text-align:center;min-height:1em}
.demo{position:fixed;top:30px;right:36px;font-size:13px;font-weight:600;background:#fde68a;color:#78350f;padding:6px 12px;border-radius:99px;display:none}
@media (max-width:640px){.logo{top:18px;left:20px;font-size:24px}h1{font-size:34px;letter-spacing:-.8px}.box{margin-top:32px;padding:10px 10px 10px 18px;border-radius:18px}.box input{font-size:17px}button{padding:12px 16px;font-size:15px}.card{padding:22px 20px}.ans{font-size:20px}.demo{top:auto;bottom:16px;right:16px}}
</style></head><body>
<a class="logo" href="/">multiversal</a><span class="demo" id="demo">Preview · example answer</span>
<h1>Ask every AI at once.<br>Get one answer you can trust.</h1>
<form class="box" id="f"><input id="q" placeholder="Ask anything…" autocomplete="off" required><button id="go">Ask all</button></form>
<p class="err" id="err"></p>
<div class="card" id="card"><div class="q" id="cq"></div><div class="ans" id="ca"></div><div class="bar"><div id="cb"></div></div><div class="agree" id="cg"></div><div id="chips"></div><button class="again" id="again">Ask another</button></div>
<script>
// Endpoint: set window.MV_API, or ?api=..., else default worker URL. ?demo=1 uses example data.
const P=new URLSearchParams(location.search);
const API=P.get('api')||window.MV_API||'https://multiversal-api.YOUR-SUBDOMAIN.workers.dev/ask';
const META={ChatGPT:['#10a37f','C'],Claude:['#d97757','C'],Gemini:['#4285f4','G'],Grok:['#111','G'],Llama:['#0668e1','L'],Mistral:['#ff7000','M']};
const DEMO={question:'Is it safe to take ibuprofen with coffee?',answer:"Yes, for most healthy adults. Coffee doesn't interact with ibuprofen, but both can irritate the stomach, so take ibuprofen with food.",agree:5,total:6,models:[{name:'ChatGPT',agrees:true},{name:'Claude',agrees:true},{name:'Gemini',agrees:true},{name:'Grok',agrees:true},{name:'Llama',agrees:true},{name:'Mistral',agrees:false}]};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(d){$('cq').textContent=d.question;$('ca').textContent=d.answer;$('cg').textContent=`${d.agree} of ${d.total} AIs agree`;
$('chips').innerHTML=d.models.map(m=>{const[c,l]=META[m.name]||['#7c6cff',m.name[0]];return `<span class="chip"><i style="background:${c}">${esc(l)}</i>${esc(m.name)}<b class="${m.agrees?'y':'n'}">${m.agrees?'✓':'✕'}</b></span>`}).join('');
document.body.classList.add('answered');requestAnimationFrame(()=>$('cb').style.width=(d.total?100*d.agree/d.total:0)+'%')}
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;$('err').textContent='';$('go').disabled=true;$('go').textContent='Asking…';
try{if(P.get('demo')||(!P.get('api')&&!window.MV_API)){$('demo').style.display='block';show(DEMO);return}
const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);show(d)}
catch(x){$('err').textContent='Couldn’t reach the AIs right now. Please try again.'}finally{$('go').disabled=false;$('go').textContent='Ask all'}};
$('again').onclick=()=>{document.body.classList.remove('answered');$('cb').style.width=0;$('q').value='';$('q').focus()};
</script></body></html>
