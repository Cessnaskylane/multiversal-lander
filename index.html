<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multiversal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --text: #ece8ef;
      --line: #e83d9a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      background: var(--bg);
    }
    .mark {
      position: absolute;
      z-index: 40;
      top: max(28px, env(safe-area-inset-top, 0px));
      left: max(28px, env(safe-area-inset-left, 0px));
      margin: 0;
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #f4f0f6;
      opacity: 0;
      pointer-events: none;
    }
    .mark.visible { opacity: 1; }
    .mark.animate { animation: fadeMark 1.1s ease 0.85s forwards; }
    .mark .accent {
      color: var(--line);
      opacity: 1;
    }
    .mark .accent:last-child {
      letter-spacing: 0.12em;
      text-transform: none;
      font-size: 0.92em;
    }

    #screen1 {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    #screen1.hidden {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .beam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--line);
      box-shadow:
        0 0 8px rgba(232, 61, 154, 0.95),
        0 0 24px rgba(232, 61, 154, 0.55),
        0 0 48px rgba(232, 61, 154, 0.28);
      opacity: 0;
      transform: scaleY(0);
      transform-origin: top center;
    }
    .beam.play {
      animation: beamIn 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) 0.1s forwards;
    }
    @keyframes beamIn {
      0% { opacity: 0; transform: scaleY(0); }
      12% { opacity: 1; }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes fadeMark {
      from { opacity: 0; }
      to { opacity: 1; }
    }


    #screen2,
    #screen3 {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      background: #000;
      padding:
        max(72px, calc(env(safe-area-inset-top, 0px) + 56px))
        16px
        max(96px, calc(env(safe-area-inset-bottom, 0px) + 72px));
      gap: 10px;
      overflow: hidden;
    }
    #screen3 {
      z-index: 16;
    }
    #screen2.active,
    #screen3.active {
      display: flex;
      animation: screenIn 0.6s ease forwards;
    }
    @keyframes screenIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .portrait-wrap {
      position: relative;
      width: min(100%, 1100px);
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .portrait {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }
    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .editors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 8px;
    }
    .side-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .side-input {
      appearance: none;
      width: 100%;
      border: 1px solid rgba(232, 61, 154, 0.85);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.25);
      color: var(--text);
      font: 400 13px/1.3 Syne, system-ui, sans-serif;
      padding: 11px 12px;
      border-radius: 6px;
      outline: none;
      min-height: 42px;
    }
    .side-input::placeholder { color: rgba(232, 61, 154, 0.55); }
    .side-input:focus {
      border-color: var(--line);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.4);
    }



    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 4px 8px 0;
      gap: 18px;
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
    }
    .photo-btn {
      appearance: none;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(232, 61, 154, 0.55);
      background: rgba(232, 61, 154, 0.06);
      color: var(--line);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .photo-btn:hover,
    .photo-btn:focus-visible {
      border-color: var(--line);
      color: var(--line);
      background: rgba(232, 61, 154, 0.12);
      outline: none;
      box-shadow: 0 0 18px rgba(232, 61, 154, 0.35);
    }
    .photo-btn svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .world-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 4px 12px 12px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-left: 0;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }
    .nav-pair {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }
    .world-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .world-btn .arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .world-btn .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    .world-btn:hover:not(:disabled) {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
      filter: none;
    }
    .world-btn:hover:not(:disabled) .arrow {
      transform: translateX(3px);
    }
    .world-btn:disabled {
      opacity: 1;
      color: var(--line);
      cursor: not-allowed;
      text-shadow: none;
    }

    .back-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--line);
      font: 500 12px/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 12px 12px 12px 4px;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      filter: none;
      text-shadow: none;
      opacity: 1;
    }
    .back-btn .arrow {
      display: inline-block;
      width: 36px;
      height: 12px;
      position: relative;
      letter-spacing: 0;
      font-size: 0;
      line-height: 0;
    }
    .back-btn .arrow::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 0;
      top: 50%;
      height: 1.5px;
      background: currentColor;
      box-shadow: none;
      transform: translateY(-50%);
    }
    .back-btn .arrow::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      border-left: 1.5px solid currentColor;
      border-top: 1.5px solid currentColor;
      transform: translateY(-50%) rotate(-45deg);
    }
    .back-btn:hover {
      color: #ff5ab8;
      text-shadow: 0 0 16px rgba(232, 61, 154, 0.95);
    }
    .back-btn:hover .arrow {
      transform: translateX(-3px);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .hint {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(236, 232, 239, 0.35);
      min-height: 14px;
      text-align: center;
    }


    .screen-title {
      position: relative;
      z-index: 3;
      margin: 0 0 8px;
      width: 100%;
      text-align: center;
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.9);
      flex: 0 0 auto;
    }
    #screen4 {
      position: absolute;
      inset: 0;
      z-index: 17;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      padding:
        max(72px, calc(env(safe-area-inset-top, 0px) + 56px))
        20px
        max(96px, calc(env(safe-area-inset-bottom, 0px) + 72px));
      gap: 18px;
      overflow: hidden;
    }
    #screen4.active {
      display: flex;
      animation: screenIn 0.55s ease forwards;
    }
    #screen4[hidden] { display: none !important; }
    .s3-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(232, 61, 154, 0.08), transparent 55%),
        #000 url("assets/assembled-bg.jpg") center / cover no-repeat;
      opacity: 0.28;
      pointer-events: none;
      filter: saturate(0.7) brightness(0.55);
    }
    .s3-head {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(244, 240, 246, 0.72);
      text-align: center;
    }
    .scenario-grid {
      position: relative;
      z-index: 2;
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      flex: 0 1 auto;
      max-height: min(62dvh, 560px);
      overflow: auto;
      padding: 2px;
    }
    .scenario {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(8, 8, 12, 0.72);
      color: var(--text);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .scenario:hover {
      border-color: rgba(232, 61, 154, 0.55);
    }
    .scenario[aria-pressed="true"] {
      border-color: var(--line);
      box-shadow: 0 0 0 1px rgba(232, 61, 154, 0.45), 0 0 28px rgba(232, 61, 154, 0.22);
    }
    .scenario-art {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .scenario-label {
      padding: 12px 14px 14px;
      font-size: 13px;
      letter-spacing: 0.04em;
      line-height: 1.35;
    }
    .scenario-label strong {
      display: block;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--line);
      margin-bottom: 6px;
    }
    .s3-foot {
      position: relative;
      z-index: 2;
      width: min(100%, 980px);
      display: flex;
      justify-content: flex-end;
      padding-top: 4px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      flex: 0 0 auto;
    }
    @media (max-width: 820px) {
      .scenario-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: min(58dvh, 520px);
      }
    }
    @media (max-width: 520px) {
      .scenario-grid {
        grid-template-columns: 1fr;
        max-height: min(54dvh, 480px);
      }
    }

    @media (max-width: 720px) {
      .editors {
        max-width: 100%;
        gap: 10px;
        padding: 0;
        flex: 0 0 auto;
      }
      .side-input {
        font-size: 12px;
        padding: 10px;
        min-height: 38px;
      }
      .portrait {
        flex: 1 1 auto;
        max-height: min(46dvh, 400px);
      }
      .portrait-wrap {
        flex: 1 1 auto;
        min-height: 0;
      }
      .hint {
        display: none;
      }
      .screen-title {
        font-size: 13px;
        letter-spacing: 0.28em;
        margin-bottom: 4px;
      }
      .world-btn {
        min-height: 44px;
        padding: 14px 8px 14px 12px;
      }
      #screen2,
      #screen3,
      #screen4 {
        padding-bottom: max(108px, calc(env(safe-area-inset-bottom, 0px) + 88px));
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="mark" id="wordmark"><span class="accent">Multi</span>versal <span class="accent">.ai</span></p>

    <div id="screen1" aria-label="Door">
      <div class="beam" id="beam" aria-hidden="true"></div>
    </div>

    <div id="screen2" aria-label="Who are you">
      <h1 class="screen-title">Who are you?</h1>
      <div class="portrait-wrap">
        <div class="portrait">
          <img src="assets/split-self.png" alt="" />
        </div>
      </div>

      <div class="editors">
        <div class="side-box">
          <input
            class="side-input"
            id="input-left"
            type="text"
            maxlength="120"
            placeholder="change this one…"
            aria-label="Edit left version"
          />
        </div>
        <div class="side-box">
          <input
            class="side-input"
            id="input-right"
            type="text"
            maxlength="120"
            placeholder="change this one…"
            aria-label="Edit right version"
          />
        </div>
      </div>

      <div class="controls">
        <button type="button" class="photo-btn" id="add-photo" aria-label="Add photo" title="Add photo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7.5h3l1.4-2h7.2l1.4 2H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-9A1.5 1.5 0 0 1 4 7.5z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
        </button>
        <div class="nav-pair">
          <button type="button" class="back-btn" id="back-2" aria-label="Back"><span class="arrow" aria-hidden="true"></span> Back</button>
          <button type="button" class="world-btn" id="world-btn" aria-disabled="false">Continue <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
      <p class="hint" id="hint"></p>
      <input class="file-input" type="file" accept="image/*" id="file-photo" tabindex="-1" aria-hidden="true" />
    </div>

    
    <div id="screen3" aria-label="Who do you meet" hidden>
      <h1 class="screen-title">Who do you meet?</h1>
      <div class="portrait-wrap">
        <div class="portrait">
          <img src="assets/split-meet.png?v=2" alt="" />
        </div>
      </div>

      <div class="editors">
        <div class="side-box">
          <input
            class="side-input"
            id="meet-input-left"
            type="text"
            maxlength="120"
            placeholder="change this one…"
            aria-label="Edit left meet version"
          />
        </div>
        <div class="side-box">
          <input
            class="side-input"
            id="meet-input-right"
            type="text"
            maxlength="120"
            placeholder="change this one…"
            aria-label="Edit right meet version"
          />
        </div>
      </div>

      <div class="controls">
        <button type="button" class="photo-btn" id="meet-add-photo" aria-label="Add photo" title="Add photo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7.5h3l1.4-2h7.2l1.4 2H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18v-9A1.5 1.5 0 0 1 4 7.5z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
        </button>
        <div class="nav-pair">
          <button type="button" class="back-btn" id="back-3" aria-label="Back"><span class="arrow" aria-hidden="true"></span> Back</button>
          <button type="button" class="world-btn" id="meet-continue" aria-disabled="false">Continue <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
      <p class="hint" id="meet-hint"></p>
      <input class="file-input" type="file" accept="image/*" id="meet-file-photo" tabindex="-1" aria-hidden="true" />
    </div>

    <div id="screen4" aria-label="Scenarios" hidden>
      <div class="s3-bg" aria-hidden="true"></div>
      <p class="s3-head">Where do you meet</p>
      <div class="scenario-grid" id="scenario-grid" role="listbox" aria-label="Scenarios">
        <button type="button" class="scenario" role="option" data-scenario="couch" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/couch.png" alt="" />
          <span class="scenario-label"><strong>Couch at home</strong>Late light. The TV is on, ignored.</span>
        </button>
        <button type="button" class="scenario" role="option" data-scenario="dinner" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/dinner.png" alt="" />
          <span class="scenario-label"><strong>Restaurant</strong>A quiet table. Someone across from you.</span>
        </button>
        <button type="button" class="scenario" role="option" data-scenario="concert" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/concert.png" alt="" />
          <span class="scenario-label"><strong>Concert</strong>Loud enough that you have to lean in.</span>
        </button>
        <button type="button" class="scenario" role="option" data-scenario="walk" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/walk.png" alt="" />
          <span class="scenario-label"><strong>Walk home</strong>Rain on the street. Same pace.</span>
        </button>
        <button type="button" class="scenario" role="option" data-scenario="rooftop" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/rooftop.png" alt="" />
          <span class="scenario-label"><strong>Rooftop</strong>City noise below. Nothing urgent.</span>
        </button>
        <button type="button" class="scenario" role="option" data-scenario="kitchen" aria-pressed="false">
          <img class="scenario-art" src="assets/scenarios/kitchen.png" alt="" />
          <span class="scenario-label"><strong>Kitchen, 2am</strong>Something simple. Talking too long.</span>
        </button>
      </div>
      <div class="s3-foot">
        <div class="nav-pair">
          <button type="button" class="back-btn" id="back-4" aria-label="Back"><span class="arrow" aria-hidden="true"></span> Back</button>
          <button type="button" class="world-btn" id="scenario-continue" disabled aria-disabled="true">Continue <span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var screen1 = document.getElementById("screen1");
      var screen2 = document.getElementById("screen2");
      var screen3 = document.getElementById("screen3");
      var screen4 = document.getElementById("screen4");
      var wordmark = document.getElementById("wordmark");
      var beam = document.getElementById("beam");
      var worldBtn = document.getElementById("world-btn");
      var addPhoto = document.getElementById("add-photo");
      var filePhoto = document.getElementById("file-photo");
      var hint = document.getElementById("hint");
      var inputLeft = document.getElementById("input-left");
      var inputRight = document.getElementById("input-right");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var introMs = reduceMotion ? 200 : 2100;
      var advanced = false;
      var starting = false;
      var photoUrl = null;

      function replayIntro() {
        wordmark.classList.remove("animate", "visible");
        beam.classList.remove("play");
        void wordmark.offsetWidth;
        void beam.offsetWidth;
        if (reduceMotion) {
          wordmark.classList.add("visible");
          beam.classList.add("play");
          return;
        }
        beam.classList.add("play");
        wordmark.classList.add("animate");
      }

      function hideAllScreens() {
        screen2.classList.remove("active");
        screen3.classList.remove("active");
        screen4.classList.remove("active");
        screen3.hidden = true;
        screen4.hidden = true;
        screen1.classList.add("hidden");
        screen1.setAttribute("aria-hidden", "true");
        screen1.style.display = "none";
      }

      function goToScreen1() {
        screen2.classList.remove("active");
        screen3.classList.remove("active");
        screen4.classList.remove("active");
        screen3.hidden = true;
        screen4.hidden = true;
        screen1.style.display = "";
        screen1.classList.remove("hidden");
        screen1.removeAttribute("aria-hidden");
        advanced = false;
        starting = false;
        wordmark.classList.remove("animate", "visible");
        beam.classList.remove("play");
        void wordmark.offsetWidth;
        void beam.offsetWidth;
        onStart();
      }

      function goToScreen2() {
        screen3.classList.remove("active");
        screen4.classList.remove("active");
        screen3.hidden = true;
        screen4.hidden = true;
        screen1.classList.add("hidden");
        screen1.setAttribute("aria-hidden", "true");
        wordmark.classList.remove("animate");
        wordmark.classList.add("visible");
        screen2.classList.add("active");
        advanced = true;
        setTimeout(function () {
          if (advanced) screen1.style.display = "none";
        }, reduceMotion ? 0 : 560);
      }

      function onStart() {
        if (advanced || starting) return;
        starting = true;
        replayIntro();
        setTimeout(goToScreen2, introMs);
      }

      // Page 1 plays on load, then advances
      onStart();

      function onEdit(side, value) {
        var text = (value || "").trim();
        if (!text) return;
        hint.textContent = side + ": " + text;
      }

      inputLeft.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          onEdit("left", inputLeft.value);
          inputLeft.value = "";
        }
      });
      inputRight.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          onEdit("right", inputRight.value);
          inputRight.value = "";
        }
      });

      addPhoto.addEventListener("click", function () {
        filePhoto.click();
      });

      filePhoto.addEventListener("change", function () {
        var file = filePhoto.files && filePhoto.files[0];
        if (!file) return;
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = URL.createObjectURL(file);
        hint.textContent = "photo added";
      });

      var scenarios = Array.prototype.slice.call(document.querySelectorAll(".scenario"));
      var scenarioContinue = document.getElementById("scenario-continue");
      var selectedScenario = null;
      var meetContinue = document.getElementById("meet-continue");
      var meetAddPhoto = document.getElementById("meet-add-photo");
      var meetFilePhoto = document.getElementById("meet-file-photo");
      var meetHint = document.getElementById("meet-hint");
      var meetInputLeft = document.getElementById("meet-input-left");
      var meetInputRight = document.getElementById("meet-input-right");
      var meetPhotoUrl = null;

      function goToScreen3() {
        screen2.classList.remove("active");
        screen4.classList.remove("active");
        screen4.hidden = true;
        screen3.hidden = false;
        screen3.classList.add("active");
      }

      function goToScreen4() {
        screen2.classList.remove("active");
        screen3.classList.remove("active");
        screen3.hidden = true;
        screen4.hidden = false;
        screen4.classList.add("active");
      }

      document.getElementById("back-2").addEventListener("click", function () {
        goToScreen1();
      });
      document.getElementById("back-3").addEventListener("click", function () {
        goToScreen2();
      });
      document.getElementById("back-4").addEventListener("click", function () {
        goToScreen3();
      });

      worldBtn.addEventListener("click", function () {
        goToScreen3();
      });

      meetAddPhoto.addEventListener("click", function () {
        meetFilePhoto.click();
      });
      meetFilePhoto.addEventListener("change", function () {
        var file = meetFilePhoto.files && meetFilePhoto.files[0];
        if (!file) return;
        if (meetPhotoUrl) URL.revokeObjectURL(meetPhotoUrl);
        meetPhotoUrl = URL.createObjectURL(file);
        meetHint.textContent = "photo added";
      });
      function onMeetEdit(side, value) {
        var text = (value || "").trim();
        if (!text) return;
        meetHint.textContent = side + ": " + text;
      }
      meetInputLeft.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          onMeetEdit("left", meetInputLeft.value);
          meetInputLeft.value = "";
        }
      });
      meetInputRight.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          onMeetEdit("right", meetInputRight.value);
          meetInputRight.value = "";
        }
      });

      meetContinue.addEventListener("click", function () {
        goToScreen4();
      });

      scenarios.forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedScenario = btn.getAttribute("data-scenario");
          scenarios.forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          scenarioContinue.disabled = false;
          scenarioContinue.setAttribute("aria-disabled", "false");
        });
      });

      scenarioContinue.addEventListener("click", function () {
        if (!selectedScenario) return;
        meetHint.textContent = "scenario: " + selectedScenario;
      });
    })();
  </script>
</body>
</html>
