<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>multiversal — coming soon</title>
<meta name="description" content="Every version of you. Coming soon.">
<meta name="theme-color" content="#07070c">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070c;
    --text: #f4f0f8;
    --muted: rgba(244, 240, 248, 0.55);
    --grad: linear-gradient(90deg, #8b7cff, #e879f9, #38bdf8);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 70% 50% at 20% 15%, #8b7cff22, transparent 55%),
      radial-gradient(ellipse 60% 45% at 85% 80%, #38bdf822, transparent 50%),
      radial-gradient(ellipse 50% 40% at 70% 20%, #e879f918, transparent 45%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow-x: hidden;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 920px;
    width: 100%;
  }
  .mark-wrap {
    position: relative;
    display: grid;
    place-items: center;
    margin-bottom: 28px;
    isolation: isolate;
  }
  .mark-wrap .mark {
    grid-area: 1 / 1;
    font-family: Syne, Inter, system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(42px, 9vw, 88px);
    letter-spacing: -0.04em;
    line-height: 1;
    user-select: none;
  }
  .mark-wrap .mark.echo {
    background: none;
    color: transparent;
    -webkit-text-stroke: 1px rgba(232, 121, 249, 0.18);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .mark-wrap .mark.echo.e1 { transform: translate(-10px, -8px) scale(1.03); }
  .mark-wrap .mark.echo.e2 { transform: translate(12px, 7px) scale(0.985); -webkit-text-stroke-color: rgba(56, 189, 248, 0.16); }
  .mark-wrap .mark.echo.e3 { transform: translate(-4px, 11px) scale(1.015); -webkit-text-stroke-color: rgba(139, 124, 255, 0.14); }
  .mark-wrap h1.mark {
    position: relative;
    z-index: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: clamp(42px, 9vw, 88px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    font-family: Syne, Inter, system-ui, sans-serif;
  }
  .coming {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .tagline {
    font-family: Syne, Inter, system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 4.2vw, 34px);
    letter-spacing: -0.02em;
    line-height: 1.25;
    color: var(--text);
  }
  @media (max-width: 520px) {
    .mark-wrap .mark.echo.e1 { transform: translate(-6px, -5px) scale(1.025); }
    .mark-wrap .mark.echo.e2 { transform: translate(7px, 5px) scale(0.99); }
    .mark-wrap .mark.echo.e3 { transform: translate(-3px, 7px) scale(1.01); }
    .coming { letter-spacing: 0.22em; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="mark-wrap">
      <span class="mark echo e1" aria-hidden="true">multiversal</span>
      <span class="mark echo e2" aria-hidden="true">multiversal</span>
      <span class="mark echo e3" aria-hidden="true">multiversal</span>
      <h1 class="mark">multiversal</h1>
    </div>
    <p class="coming">Coming soon</p>
    <p class="tagline">Every version of you.</p>
  </main>
</body>
</html>
