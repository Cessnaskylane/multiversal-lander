<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#050508; }
  .frame {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:28px;
    font-family: Syne, system-ui, sans-serif;
  }
  .mark {
    margin:0;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #f4f0f6;
  }
  .mark .m { letter-spacing: 0.28em; }
  .mark .rest {
    color: #e83d9a;
    letter-spacing: 0.28em;
  }
  .mark .ai {
    color: #e83d9a;
    letter-spacing: 0.12em;
    text-transform: none;
    font-size: 0.92em;
  }
  
  .key {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    max-width: 420px;
  }
  .swatch {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color: rgba(244,240,246,0.55);
  }
  .dot {
    width:28px; height:28px; border-radius:0;
    border:1px solid rgba(255,255,255,0.2);
  }
  .tag {
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color: rgba(244,240,246,0.35);
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="tag">mock A · solid letters, Syne uppercase, tracking like the lander</p>
    <p class="mark"><span class="m" style="color:#d4d4d8" title="X">M</span><span class="m" style="color:#fe2c55" title="TikTok">U</span><span class="m" style="color:#f97316" title="Instagram">L</span><span class="m" style="color:#f4f4f5" title="YouTube">T</span><span class="m" style="color:#6366f1" title="Facebook">I</span><span class="rest">versal</span> <span class="ai">.ai</span></p>
    <div class="key">
      <div class="swatch"><div class="dot" style="background:#d4d4d8"></div><span>M · X</span></div><div class="swatch"><div class="dot" style="background:#fe2c55"></div><span>U · TikTok</span></div><div class="swatch"><div class="dot" style="background:#f97316"></div><span>L · Instagram</span></div><div class="swatch"><div class="dot" style="background:#f4f4f5"></div><span>T · YouTube</span></div><div class="swatch"><div class="dot" style="background:#6366f1"></div><span>I · Facebook</span></div>
      <div class="swatch"><div class="dot" style="background:#e83d9a"></div><span>versal · .ai</span></div>
    </div>
  </div>
</body></html>
