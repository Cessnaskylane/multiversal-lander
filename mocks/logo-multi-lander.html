<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#050508; }
  .mark {
    position:absolute;
    top:28px; left:28px;
    margin:0;
    font-family: Syne, system-ui, sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #f4f0f6;
  }
  .mark .rest { color: #e83d9a; }
  .mark .ai {
    color: #e83d9a;
    letter-spacing: 0.12em;
    text-transform: none;
    font-size: 0.92em;
  }
  .hint {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: rgba(244,240,246,0.25);
    font-family: Syne, system-ui, sans-serif;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
  }
</style>
</head>
<body>
  <p class="mark"><span style="color:#d4d4d8">M</span><span style="color:#fe2c55">U</span><span style="color:#f97316">L</span><span style="color:#f4f4f5">T</span><span style="color:#6366f1">I</span><span class="rest">versal</span> <span class="ai">.ai</span></p>
  <div class="hint">lander scale · top left</div>
</body></html>
