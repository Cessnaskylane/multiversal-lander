<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Liquid Mark</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Syne:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#07070B;color:#F2F0FF}
body{min-height:100vh;overflow:hidden;position:relative}
.nav{position:relative;z-index:5;display:flex;justify-content:space-between;padding:28px 48px}
.nav a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,240,255,.4);text-decoration:none}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 90px);text-align:center;padding:40px 24px}
.orb{
  width:min(420px,70vw);height:min(420px,70vw);border-radius:50%;position:relative;margin-bottom:48px;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), transparent 25%),
    radial-gradient(circle at 60% 60%, #5EEAD4, transparent 40%),
    radial-gradient(circle at 40% 70%, #7B5CFF, transparent 45%),
    radial-gradient(circle at 70% 35%, #3D9BFF, transparent 40%),
    linear-gradient(135deg,#2A1F5C,#0E2840);
  box-shadow:
    0 0 100px rgba(123,92,255,.45),
    0 0 200px rgba(94,234,212,.2),
    inset 0 0 60px rgba(255,255,255,.15);
  filter:saturate(1.2);
}
.orb::before{
  content:"";position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), transparent 50%);
  filter:blur(8px)
}
.orb::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:inset 0 0 30px rgba(255,255,255,.08)
}
.mark{
  font-family:Syne,sans-serif;font-weight:600;font-size:clamp(28px,4vw,42px);
  letter-spacing:.08em;margin-bottom:16px
}
.mark .m{color:#A78BFF}.mark .v{color:#F2F0FF}.mark .ai{color:#5EEAD4}
.sub{font-size:15px;font-weight:300;color:rgba(242,240,255,.5);max-width:380px;line-height:1.55;margin-bottom:32px}
.cta{display:inline-block;border:1px solid rgba(242,240,255,.35);color:#F2F0FF;padding:12px 28px;text-decoration:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase;border-radius:999px}
.cta:hover{background:rgba(242,240,255,.06)}
.tiny{position:absolute;bottom:36px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,240,255,.25);z-index:5}
@media(max-width:900px){body{overflow:auto}.nav{padding:20px}.orb{margin-bottom:32px}.tiny{position:relative;bottom:auto;padding:40px 0}}
</style>
</head>
<body>
<nav class="nav">
  <a href="#">Studio</a>
  <a href="#">Work</a>
</nav>
<main class="stage">
  <div class="orb" aria-hidden="true"></div>
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <p class="sub">Brand-forward. Liquid glass frozen mid-motion. Product secondary — agency energy, house confidence.</p>
  <a class="cta" href="#">Enter</a>
</main>
<p class="tiny">Identity system · 2026</p>
</body>
</html>
