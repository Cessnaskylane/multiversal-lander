<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Prism Type</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#050505;color:#FFF}
body{min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
.nav{display:flex;justify-content:space-between;padding:24px 40px;position:relative;z-index:2}
.nav a{font-size:12px;color:rgba(255,255,255,.45);text-decoration:none;letter-spacing:.08em;text-transform:uppercase}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.word{
  font-family:Syne,sans-serif;font-weight:800;font-size:clamp(64px,16vw,220px);
  line-height:.85;letter-spacing:-.06em;text-align:center;position:relative;
  background:linear-gradient(100deg,#FF6B9D 0%,#7B5CFF 25%,#3D9BFF 50%,#5EEAD4 75%,#FF6B9D 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(2px 0 0 rgba(255,100,150,.4)) drop-shadow(-2px 0 0 rgba(94,234,212,.4));
}
.word .ai{display:block;font-size:.35em;letter-spacing:.2em;margin-top:.15em;font-weight:600}
.chrome{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;pointer-events:none;opacity:.4;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.below{position:relative;z-index:2;text-align:center;margin-top:48px;max-width:480px}
.below p{font-size:15px;font-weight:300;color:rgba(255,255,255,.55);line-height:1.55;margin-bottom:28px}
.cta{display:inline-block;background:#fff;color:#050505;padding:14px 28px;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.04em;border-radius:4px}
.ghost{display:inline-block;margin-left:16px;color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px}
.edges{position:absolute;inset:0;pointer-events:none;opacity:.15;
  background:repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(255,255,255,.4) 80px,rgba(255,255,255,.4) 81px)}
@media(max-width:900px){
  body{overflow:auto}.word{font-size:72px}.nav{padding:18px 20px}
  .below{margin:32px 16px 48px}.chrome{display:none}
}
</style>
</head>
<body>
<nav class="nav">
  <a href="#">Type</a>
  <a href="#">Enter</a>
</nav>
<main class="stage">
  <div class="edges"></div>
  <div class="chrome"><span>01 / wordmark</span><span>chromatic</span></div>
  <h1 class="word">multiversal<span class="ai">.ai</span></h1>
  <div class="below">
    <p>The product is the name. Huge type. Chromatic edge. Almost no chrome — because the mark carries the bet.</p>
    <a class="cta" href="#">Start</a>
    <a class="ghost" href="#">Brand kit</a>
  </div>
</main>
</body>
</html>
