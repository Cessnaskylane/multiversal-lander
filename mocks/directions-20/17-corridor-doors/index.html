<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Corridor of Doors</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Space Grotesk",system-ui,sans-serif;background:#06060C;color:#EDE9FF}
body{min-height:100vh;overflow:hidden;perspective:1200px}
.nav{position:relative;z-index:10;display:flex;justify-content:space-between;padding:24px 40px}
.mark{font-size:12px;letter-spacing:.4em;text-transform:lowercase}
.mark .m{color:#A78BFF}.mark .v{color:#EDE9FF}.mark .ai{color:#5EEAD4}
.nav a{color:rgba(237,233,255,.4);text-decoration:none;font-size:12px}
.corridor{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform-style:preserve-3d
}
.floor{
  position:absolute;bottom:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,transparent,rgba(10,10,20,.9));
  background-image:
    linear-gradient(90deg,rgba(167,139,255,.08) 1px,transparent 1px),
    linear-gradient(rgba(167,139,255,.05) 1px,transparent 1px);
  background-size:60px 60px;
  transform:rotateX(60deg);transform-origin:bottom center;opacity:.6
}
.doors{
  display:flex;gap:28px;align-items:flex-end;padding:0 40px;
  transform:translateZ(0);position:relative;z-index:2;margin-top:8vh
}
.door{
  width:160px;height:320px;border-radius:12px 12px 4px 4px;position:relative;
  border:1px solid rgba(167,139,255,.35);
  background:rgba(20,16,40,.6);overflow:hidden;
  box-shadow:0 0 40px rgba(123,92,255,.2), inset 0 0 40px rgba(94,234,212,.05);
  transition:transform .3s, box-shadow .3s
}
.door:nth-child(1){transform:scale(.85) translateY(20px);opacity:.7}
.door:nth-child(2){transform:scale(.95) translateY(8px);opacity:.85}
.door:nth-child(3){transform:scale(1.08);box-shadow:0 0 80px rgba(123,92,255,.45), inset 0 0 60px rgba(94,234,212,.1);border-color:rgba(94,234,212,.5)}
.door:nth-child(4){transform:scale(.95) translateY(8px);opacity:.85}
.door:nth-child(5){transform:scale(.85) translateY(20px);opacity:.7}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;mix-blend-mode:luminosity}
.door .glow{position:absolute;inset:0;background:linear-gradient(180deg,rgba(123,92,255,.25),transparent 40%,rgba(5,5,12,.8))}
.door .label{position:absolute;bottom:16px;left:12px;right:12px;font-size:12px;letter-spacing:.08em;z-index:2}
.door .label span{display:block;font-size:10px;color:#5EEAD4;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.copy{
  position:absolute;top:18%;left:0;right:0;z-index:5;text-align:center;padding:0 24px;pointer-events:none
}
.copy h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(32px,4vw,52px);line-height:1.15;margin-bottom:14px}
.copy h1 em{font-style:italic;color:#C4B5FF}
.copy p{font-size:15px;font-weight:300;color:rgba(237,233,255,.55);max-width:420px;margin:0 auto 24px;line-height:1.5}
.copy a{pointer-events:auto;display:inline-block;background:rgba(237,233,255,.95);color:#06060C;padding:12px 24px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:500}
@media(max-width:900px){
  body{overflow:auto}.doors{gap:12px;padding:0 16px;overflow-x:auto;justify-content:flex-start;margin:40vh 0 40px}
  .door{width:120px;height:240px;flex-shrink:0}.door:nth-child(n){transform:none;opacity:1}
  .copy{top:12%}.nav{padding:18px 20px}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <a href="#">Walk the corridor</a>
</nav>
<div class="copy">
  <h1>Pick a world.<br>Step through a <em>door</em>.</h1>
  <p>Architectural depth. Glowing thresholds. Each doorway a verse you can inhabit.</p>
  <a href="#">Enter the corridor</a>
</div>
<div class="corridor">
  <div class="floor"></div>
  <div class="doors">
    <div class="door"><img src="../_shared/worlds/paris.png" alt=""><div class="glow"></div><div class="label"><span>01</span>Paris night</div></div>
    <div class="door"><img src="../_shared/worlds/kitchen.png" alt=""><div class="glow"></div><div class="label"><span>02</span>Quiet kitchen</div></div>
    <div class="door"><img src="../_shared/worlds/intro-door.png" alt=""><div class="glow"></div><div class="label"><span>03</span>Origin door</div></div>
    <div class="door"><img src="../_shared/worlds/rooftop.png" alt=""><div class="glow"></div><div class="label"><span>04</span>Rooftop</div></div>
    <div class="door"><img src="../_shared/worlds/future.png" alt=""><div class="glow"></div><div class="label"><span>05</span>Future rail</div></div>
  </div>
</div>
</body>
</html>
