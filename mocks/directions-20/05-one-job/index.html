<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — One Job</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#FAFAF8;color:#1C1C1C}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(123,92,255,.06), transparent 60%),
    #FAFAF8;
}
.top{padding:32px 48px;display:flex;justify-content:space-between;align-items:center}
.mark{font-size:12px;letter-spacing:.45em;text-transform:lowercase}
.mark .m{color:#7B5CFF}.mark .v{color:#1C1C1C}.mark .ai{color:#5EEAD4;letter-spacing:.18em;opacity:.9}
.top a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9A9690;text-decoration:none}
.center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px 80px;position:relative
}
.face{
  width:180px;height:180px;border-radius:50%;object-fit:cover;object-position:top;
  margin-bottom:40px;box-shadow:0 30px 60px rgba(28,28,28,.12);
  border:1px solid rgba(28,28,28,.06)
}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:clamp(36px,5vw,64px);line-height:1.12;letter-spacing:-.01em;
  max-width:720px;margin-bottom:28px
}
.cta{
  display:inline-flex;align-items:center;gap:12px;
  background:#1C1C1C;color:#FAFAF8;padding:16px 32px;border-radius:999px;
  text-decoration:none;font-size:14px;letter-spacing:.04em;font-weight:400;
  transition:transform .2s
}
.cta:hover{transform:scale(1.02)}
.cta i{width:7px;height:7px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 10px #5EEAD4;font-style:normal}
.secondary{margin-top:28px;font-size:13px;color:#9A9690;font-weight:300}
.secondary a{color:#6B6760;text-decoration:none;border-bottom:1px solid rgba(107,103,96,.35)}
@media(max-width:900px){
  .top{padding:22px 22px}.face{width:140px;height:140px;margin-bottom:28px}
  h1{font-size:36px}
}
</style>
</head>
<body>
<div class="top">
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <a href="#">Account</a>
</div>
<main class="center">
  <img class="face" src="../_shared/faces/einstein.webp" alt="Albert">
  <h1>Talk to Albert.</h1>
  <a class="cta" href="#"><i></i> Begin</a>
  <p class="secondary">Or <a href="#">choose another mind</a></p>
</main>
</body>
</html>
