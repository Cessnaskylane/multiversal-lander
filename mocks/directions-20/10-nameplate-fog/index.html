<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Nameplate Fog</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#0A0A0A;color:#F5F5F5}
body{
  min-height:100vh;overflow:hidden;position:relative;
  background:#0A0A0A;
}
.fog{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 50% at 50% 40%, rgba(255,255,255,.09), transparent 55%),
    radial-gradient(ellipse 60% 40% at 30% 70%, rgba(123,92,255,.08), transparent 50%),
    radial-gradient(ellipse 50% 30% at 70% 20%, rgba(255,255,255,.05), transparent 45%);
  filter:blur(2px)
}
.nav{position:relative;z-index:2;display:flex;justify-content:space-between;padding:32px 56px}
.nav a{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,245,245,.4);text-decoration:none}
.stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 100px);text-align:center;padding:40px 24px}
.tiny{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:rgba(245,245,245,.35);margin-bottom:48px}
h1{
  font-family:"Bodoni Moda",Didot,serif;font-weight:400;
  font-size:clamp(64px,12vw,160px);line-height:.92;letter-spacing:-.04em;
  margin-bottom:8px
}
h1 .m{color:#7B5CFF}
h1 .v{color:#F5F5F5}
h1 .ai{display:block;font-size:.28em;letter-spacing:.5em;color:#5EEAD4;margin-top:18px;font-family:Inter,sans-serif;font-weight:300}
.line{width:48px;height:1px;background:rgba(245,245,245,.3);margin:36px auto}
.sub{font-size:14px;font-weight:300;letter-spacing:.12em;color:rgba(245,245,245,.45);max-width:360px;line-height:1.7;margin-bottom:40px}
.cta{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#F5F5F5;text-decoration:none;border-bottom:1px solid rgba(245,245,245,.4);padding-bottom:6px}
.plates{
  position:absolute;bottom:40px;left:0;right:0;z-index:2;
  display:flex;justify-content:center;gap:48px;flex-wrap:wrap;padding:0 24px
}
.plate{font-family:"Bodoni Moda",serif;font-size:18px;letter-spacing:.08em;color:rgba(245,245,245,.25)}
@media(max-width:900px){
  body{overflow:auto}.nav{padding:22px}.plates{position:relative;bottom:auto;margin:48px 0 40px;gap:24px}
  h1{font-size:72px}
}
</style>
</head>
<body>
<div class="fog"></div>
<nav class="nav">
  <a href="#">House</a>
  <a href="#">Enter</a>
</nav>
<main class="stage">
  <p class="tiny">Maison Multiversal</p>
  <h1><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></h1>
  <div class="line"></div>
  <p class="sub">Sparse. Certain. One accent. Presence as couture.</p>
  <a class="cta" href="#">Request access</a>
</main>
<div class="plates">
  <span class="plate">Albert</span>
  <span class="plate">Joan</span>
  <span class="plate">Plato</span>
  <span class="plate">Muse</span>
</div>
</body>
</html>
