<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Split Reality</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"DM Sans",system-ui,sans-serif;background:#0E0E10;color:#F0EEE8}
body{min-height:100vh;overflow:hidden}
.nav{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:24px 40px}
.mark{font-size:12px;letter-spacing:.4em;text-transform:lowercase}
.mark .m{color:#A78BFF}.mark .v{color:#F0EEE8}.mark .ai{color:#5EEAD4}
.nav a{color:rgba(240,238,232,.5);text-decoration:none;font-size:12px}
.split{display:grid;grid-template-columns:1fr 1fr;height:100vh;position:relative}
.side{position:relative;overflow:hidden}
.side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,16,.3),rgba(14,14,16,.75))}
.side .cap{position:absolute;bottom:80px;left:40px;right:40px;z-index:2}
.side .cap .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#5EEAD4;margin-bottom:10px}
.side .cap h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:32px;line-height:1.15;margin-bottom:8px}
.side .cap p{font-size:14px;font-weight:300;color:rgba(240,238,232,.6)}
.divider{
  position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(240,238,232,.3);z-index:10;
  transform:translateX(-50%)
}
.toggle{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;
  background:#F0EEE8;color:#0E0E10;border:none;border-radius:999px;padding:12px 20px;
  font-family:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
  box-shadow:0 10px 40px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;gap:10px
}
.toggle span{width:8px;height:8px;border-radius:50%;background:#7B5CFF}
.overlay-copy{
  position:absolute;top:100px;left:50%;transform:translateX(-50%);z-index:12;
  text-align:center;width:min(560px,90vw);pointer-events:none
}
.overlay-copy h1{font-family:"Instrument Serif",serif;font-size:clamp(28px,3.5vw,42px);font-weight:400;line-height:1.15;margin-bottom:12px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.overlay-copy h1 em{font-style:italic;color:#C4B5FF}
.overlay-copy p{font-size:14px;font-weight:300;color:rgba(240,238,232,.7);margin-bottom:16px}
.overlay-copy a{pointer-events:auto;display:inline-block;color:#F0EEE8;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid rgba(240,238,232,.4);padding-bottom:4px}
@media(max-width:900px){
  body{overflow:auto}.split{grid-template-columns:1fr;height:auto}
  .side{height:50vh}.overlay-copy{position:relative;top:auto;left:auto;transform:none;padding:32px 20px;background:#0E0E10;width:100%}
  .toggle{top:auto;bottom:20px}.divider{display:none}.nav{position:relative}
  .side .cap{bottom:24px;left:20px;right:20px}.side .cap h2{font-size:24px}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <a href="#">Compare lives</a>
</nav>
<div class="overlay-copy">
  <h1>Same person.<br><em>Two realities.</em></h1>
  <p>Toggle the fork. Talk to either self before you choose.</p>
  <a href="#">Begin split</a>
</div>
<div class="divider"></div>
<button class="toggle" type="button"><span></span> Toggle reality</button>
<main class="split">
  <section class="side">
    <img src="../_shared/faces/cut-man-brunette.png" alt="">
    <div class="cap">
      <p class="lbl">Reality A · stay</p>
      <h2>The life you know</h2>
      <p>Same city. Same desk. Compound familiarity.</p>
    </div>
  </section>
  <section class="side">
    <img src="../_shared/faces/cut-man-silver.png" alt="">
    <div class="cap">
      <p class="lbl">Reality B · leap</p>
      <h2>The life you fork</h2>
      <p>New rail. New weather. Same spine.</p>
    </div>
  </section>
</main>
</body>
</html>
