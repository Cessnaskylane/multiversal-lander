<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Soft Heaven</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;color:#3A3A45}
body{
  min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#F7F3EB 0%,#E8EEF6 45%,#D9E4F2 100%);
}
.clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cloud{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0));
  filter:blur(20px)
}
.c1{width:500px;height:200px;top:10%;left:-5%;opacity:.8}
.c2{width:400px;height:180px;top:25%;right:-8%;opacity:.6}
.c3{width:600px;height:220px;bottom:5%;left:20%;opacity:.5}
.gold{position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 30%,rgba(232,200,140,.25),transparent 60%);pointer-events:none}
.nav{position:relative;z-index:2;display:flex;justify-content:space-between;padding:28px 48px}
.mark{font-size:12px;letter-spacing:.4em;text-transform:lowercase;font-weight:300}
.mark .m{color:#8B7CF0}.mark .v{color:#3A3A45}.mark .ai{color:#5BA3D9;letter-spacing:.15em}
.nav a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7A7A88;text-decoration:none;font-weight:300}
.hero{position:relative;z-index:2;text-align:center;padding:8vh 24px 40px;max-width:800px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#9A8B6E;margin-bottom:24px;font-weight:300}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(40px,5.5vw,68px);line-height:1.15;margin-bottom:22px;color:#2E2E38}
h1 em{font-style:italic;color:#7B6BC9}
.sub{font-size:16px;font-weight:300;line-height:1.65;color:#6A6A78;max-width:460px;margin:0 auto 36px}
.cta{display:inline-block;background:rgba(255,255,255,.65);border:1px solid rgba(123,107,201,.25);color:#3A3A45;padding:14px 32px;border-radius:999px;text-decoration:none;font-size:13px;letter-spacing:.06em;backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(180,160,120,.15)}
.guides{display:flex;justify-content:center;gap:28px;margin-top:64px;flex-wrap:wrap}
.guide{text-align:center}
.guide img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(100,120,150,.15);margin-bottom:10px}
.guide span{display:block;font-size:12px;font-weight:300;color:#6A6A78;letter-spacing:.06em}
.ghost{display:block;margin-top:20px;font-size:13px;color:#8A8A98;text-decoration:none}
@media(max-width:900px){body{overflow:auto}.nav{padding:20px}.guides{margin-top:40px;gap:18px;padding-bottom:40px}}
</style>
</head>
<body>
<div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="gold"></div>
<nav class="nav">
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <a href="#">Guides</a>
</nav>
<main class="hero">
  <p class="eyebrow">Soft heaven</p>
  <h1>Gentle minds<br>for restless <em>days</em></h1>
  <p class="sub">Ethereal calm — pale gold and blue. No pitch, no doctrine. Just presence that steadies the room.</p>
  <a class="cta" href="#">Meet a guide</a>
  <a class="ghost" href="#">Why softness matters</a>
  <div class="guides">
    <div class="guide"><img src="../_shared/faces/counsel.webp" alt=""><span>Counsel</span></div>
    <div class="guide"><img src="../_shared/faces/muse.webp" alt=""><span>Muse</span></div>
    <div class="guide"><img src="../_shared/faces/guide.webp" alt=""><span>Guide</span></div>
  </div>
</main>
</body>
</html>
