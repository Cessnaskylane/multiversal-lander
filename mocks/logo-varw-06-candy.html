<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(fonts/syne-latin-700.woff2) format('woff2');
}
html, body { margin:0; height:100%; background:#050508; }
.wrap {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap: 18px;
}
.tag {
  margin:0;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(244,240,246,0.38);
}
.mark {
  margin: 0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f4f0f6;
}
.mark .rest { color: #f4f0f6; }
.mark .accent.dot {
  color: #e83d9a;
  letter-spacing: 0.1em;
  text-transform: none;
  font-size: 0.9em;
  font-weight: 700;
}
.swatches {
  display:flex; gap:8px; margin-top: 4px;
}
.swatches i {
  width: 18px; height: 18px; border-radius: 4px;
  display:block;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
</style>
</head>
<body>
  <div class="wrap">
    <p class="tag">06-candy</p>
    <p class="mark"><span style="color:#ff6bcb">M</span><span style="color:#ff8fab">U</span><span style="color:#ffa94d">L</span><span style="color:#69db7c">T</span><span style="color:#74c0fc">I</span><span class="rest">versal</span> <span class="accent dot">.ai</span></p>
    <div class="swatches">
      <i style="background:#ff6bcb"></i><i style="background:#ff8fab"></i><i style="background:#ffa94d"></i><i style="background:#69db7c"></i><i style="background:#74c0fc"></i>
    </div>
  </div>
</body></html>
