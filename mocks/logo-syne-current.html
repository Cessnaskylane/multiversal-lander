<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(fonts/syne-latin-700.woff2) format('woff2');
}
html, body { margin:0; height:100%; background:#050508; }
.frame {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
}
.mark {
  margin: 0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 56px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f4f0f6;
}
.mark .m { color: #e83d9a; }
.mark .u { color: #9b2bcb; }
.mark .l { color: #6d28d9; }
.mark .t { color: #4338ca; }
.mark .i { color: #1d4ed8; }
.mark .accent.dot {
  color: #e83d9a;
  letter-spacing: 0.1em;
  text-transform: none;
  font-size: 0.9em;
  font-weight: 700;
}
</style>
</head>
<body>
  <div class="frame">
    <p class="mark"><span class="m">M</span><span class="u">U</span><span class="l">L</span><span class="t">T</span><span class="i">I</span>versal <span class="accent dot">.ai</span></p>
  </div>
</body></html>
