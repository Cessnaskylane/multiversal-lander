<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(https://fonts.gstatic.com/s/syne/v24/8vIS7w4qzmVxsWxjBZRjr0FKM_04uT6k.ttf) format('truetype');
}
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(https://fonts.gstatic.com/s/syne/v24/8vIS7w4qzmVxsWxjBZRjr0FKM_0KuT6k.ttf) format('truetype');
}

html, body { margin:0; height:100%; background:#050508; }
.frame { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mark {
  margin:0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: clamp(18px, 5vw, 48px);
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #f4f0f6;
}
.mark .accent { color: #e83d9a; }
.mark .accent:last-child {
  letter-spacing: 0.12em;
  text-transform: none;
  font-size: 0.92em;
}
</style>
</head>
<body>
  <div class="frame">
    <p class="mark"><span class="accent">Multi</span>versal <span class="accent">.ai</span></p>
  </div>
</body></html>
