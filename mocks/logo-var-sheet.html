<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(fonts/syne-latin-700.woff2) format('woff2');
}
html, body { margin:0; background:#050508; }
.sheet {
  padding: 36px 40px 48px;
  display:flex; flex-direction:column; gap: 28px;
}
.row {
  display:flex; flex-direction:column; gap: 8px;
}
.tag {
  margin:0;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(244,240,246,0.38);
}
.mark {
  margin: 0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.mark .rest { color: #e83d9a; }
.mark .accent.dot {
  color: #e83d9a;
  letter-spacing: 0.1em;
  text-transform: none;
  font-size: 0.9em;
  font-weight: 700;
}
.swatches { display:flex; gap:7px; }
.swatches i {
  width: 14px; height: 14px; border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
</style>
</head>
