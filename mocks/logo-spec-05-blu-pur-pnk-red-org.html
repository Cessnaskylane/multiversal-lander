<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(fonts/syne-latin-700.woff2) format('woff2');
}
html, body { margin:0; height:100%; background:#050508; }
.wrap {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap: 14px;
}
.tag {
  margin:0;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(244,240,246,0.38);
}
.legend {
  margin:0;
  font-family: Syne, system-ui, sans-serif;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: rgba(244,240,246,0.28);
}
.mark {
  margin: 0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #f4f0f6;
}
.mark .rest { color: #f4f0f6; }
.mark .accent.dot {
  color: #e83d9a;
  letter-spacing: 0.1em;
  text-transform: none;
  font-size: 0.9em;
  font-weight: 700;
}
.swatches { display:flex; gap:8px; }
.swatches i {
  width: 18px; height: 18px; border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
</style>
</head>
<body>
  <div class="wrap">
    <p class="tag">05-blu-pur-pnk-red-org</p>
    <p class="mark"><span style="color:#2f6bff">M</span><span style="color:#9b5cff">U</span><span style="color:#ff3d9a">L</span><span style="color:#ff2a2a">T</span><span style="color:#ff7a00">I</span><span class="rest">versal</span> <span class="accent dot">.ai</span></p>
    <div class="swatches"><i style="background:#2f6bff"></i><i style="background:#9b5cff"></i><i style="background:#ff3d9a"></i><i style="background:#ff2a2a"></i><i style="background:#ff7a00"></i></div>
    <p class="legend">blue · purple · pink · red · orange</p>
  </div>
</body></html>
