<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — One Mind, One Rail</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#FAFAF8;color:#1C1C1C}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse 60% 45% at 50% 100%, rgba(123,92,255,.07), transparent 55%),
    #FAFAF8;
}
.top{padding:32px 48px;display:flex;justify-content:space-between;align-items:center}
.mark{font-size:12px;letter-spacing:.45em;text-transform:lowercase}
.mark .m{color:#7B5CFF}.mark .v{color:#1C1C1C}.mark .ai{color:#5EEAD4;letter-spacing:.18em;opacity:.9}
.top a{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9A9690;text-decoration:none}
.center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 24px 72px;position:relative
}
.face-wrap{position:relative;margin-bottom:36px}
.face{
  width:168px;height:168px;border-radius:50%;object-fit:cover;object-position:top;
  box-shadow:0 32px 64px rgba(28,28,28,.1);border:1px solid rgba(28,28,28,.05);
  display:block
}
.live{
  position:absolute;bottom:6px;right:6px;
  width:18px;height:18px;border-radius:50%;background:#5EEAD4;
  border:3px solid #FAFAF8;box-shadow:0 0 12px rgba(94,234,212,.7)
}
.with{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#9A9690;margin-bottom:16px;font-weight:300}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:clamp(40px,5.5vw,68px);line-height:1.08;letter-spacing:-.01em;
  max-width:640px;margin-bottom:14px
}
.line{font-size:17px;font-weight:300;color:#6B6760;margin-bottom:40px}
.rails{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:44px
}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:999px;
  border:1px solid rgba(28,28,28,.1);background:#fff;
  font-size:13px;font-weight:400;color:#1C1C1C;letter-spacing:.02em;
  box-shadow:0 4px 16px rgba(28,28,28,.04)
}
.chip.active{border-color:rgba(123,92,255,.4);background:rgba(123,92,255,.06);color:#5A3FD4}
.chip svg{width:14px;height:14px;opacity:.7}
.cta{
  display:inline-flex;align-items:center;gap:12px;
  background:#1C1C1C;color:#FAFAF8;padding:16px 32px;border-radius:999px;
  text-decoration:none;font-size:14px;letter-spacing:.04em;font-weight:400
}
.cta i{width:7px;height:7px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 10px #5EEAD4;font-style:normal}
.secondary{margin-top:28px;font-size:13px;color:#9A9690;font-weight:300}
.secondary a{color:#6B6760;text-decoration:none;border-bottom:1px solid rgba(107,103,96,.35)}
.footnote{
  position:absolute;bottom:28px;left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C4C0B8;font-weight:300
}
@media(max-width:900px){
  .top{padding:22px}.face{width:132px;height:132px}
  h1{font-size:38px}.footnote{position:relative;bottom:auto;margin-top:48px;padding-bottom:24px}
}
</style>
</head>
<body>
<div class="top">
  <div class="mark"><span class="m">multi</span><span class="v">versal</span><span class="ai">.ai</span></div>
  <a href="#">Rails</a>
</div>
<main class="center">
  <div class="face-wrap">
    <img class="face" src="../_shared/faces/einstein.webp" alt="Albert">
    <span class="live" aria-hidden="true"></span>
  </div>
  <p class="with">Albert is with you</p>
  <h1>One mind.<br>Wherever you are.</h1>
  <p class="line">Talk to Albert — on glasses, in messages, on the web.</p>
  <div class="rails">
    <span class="chip active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10c0-3 3-5 9-5s9 2 9 5-3 5-9 5-9-2-9-5z"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1.2" fill="currentColor" stroke="none"/><path d="M12 15v2"/></svg>
      Glasses
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 01-1.2 4.3A8.5 8.5 0 013.5 15L3 21l6-1.5A8.5 8.5 0 1021 11.5z"/></svg>
      iMessage
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
      Web
    </span>
  </div>
  <a class="cta" href="#"><i></i> Talk to Albert</a>
  <p class="secondary">Or <a href="#">choose another mind</a></p>
</main>
<p class="footnote">One job · not twelve widgets</p>
</body>
</html>
