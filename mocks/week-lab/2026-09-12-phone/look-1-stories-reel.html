<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Multiversal — Stories / reel stack</title>
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(assets/syne-latin-700.woff2) format('woff2');
}
:root {
  --bg: #0b0d10;
  --silver: #c8d0d8;
  --silver-dim: rgba(200,208,216,0.55);
  --ice: #7ec8ff;
  --ice-deep: #3a9fd9;
  --chalk: #eef2f6;
  --panel: rgba(12,14,18,0.72);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--chalk);
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }

.phone {
  position: relative;
  width: 100%;
  height: 100svh; height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  overflow: hidden;
  background: #07090c;
}

.topbar {
  position: absolute; z-index: 20;
  left: 0; right: 0; top: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.mark {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--silver);
}
.mark span { color: var(--ice); }
.promise {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--silver-dim); max-width: 42%;
  text-align: right; line-height: 1.35;
}

.progress {
  position: absolute; z-index: 21;
  left: 12px; right: 12px; top: 44px;
  display: flex; gap: 4px;
}
.progress i {
  flex: 1; height: 2px; border-radius: 2px;
  background: rgba(200,208,216,0.22);
  overflow: hidden;
}
.progress i::after {
  content: ""; display: block; height: 100%; width: 0%;
  background: var(--ice);
  transition: width 0.25s ease;
}
.progress i.done::after { width: 100%; }
.progress i.active::after { width: 100%; opacity: 0.95; }

.stack {
  position: absolute; inset: 0;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.stack::-webkit-scrollbar { display: none; }

.story {
  position: relative;
  height: 100svh; height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
}

.story .face {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 22%;
  filter: saturate(0.92) contrast(1.05);
  transform: scale(1.02);
}
.story .veil {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(7,9,12,0.55) 0%, transparent 22%, transparent 48%, rgba(7,9,12,0.55) 72%, rgba(7,9,12,0.96) 100%),
    radial-gradient(ellipse 70% 50% at 50% 30%, transparent 40%, rgba(11,13,16,0.35) 100%);
  pointer-events: none;
}
.story .grain {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.07;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

.story-body {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 24px 20px calc(28px + var(--safe-b));
  z-index: 5;
  display: flex; flex-direction: column; gap: 14px;
}
.kicker {
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ice); opacity: 0.9;
}
.story h1 {
  font-size: clamp(36px, 11vw, 48px);
  font-weight: 700; letter-spacing: -0.02em;
  line-height: 0.95; color: var(--chalk);
  text-shadow: 0 2px 24px rgba(0,0,0,0.45);
}
.tone {
  font-size: 15px; line-height: 1.4;
  color: var(--silver-dim); max-width: 28ch;
  font-weight: 500;
}
.cta-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.btn {
  min-height: 52px; padding: 0 22px;
  border-radius: 999px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--ice);
  color: #061018;
  box-shadow: 0 0 0 1px rgba(126,200,255,0.35), 0 12px 28px rgba(62,159,217,0.28);
  flex: 1;
}
.btn-primary:hover { background: #9ad6ff; }
.btn-ghost {
  color: var(--silver);
  border: 1px solid rgba(200,208,216,0.28);
  background: rgba(12,14,18,0.35);
  backdrop-filter: blur(8px);
  min-width: 52px; padding: 0 16px;
  font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
}

.hint {
  position: absolute; z-index: 12;
  left: 0; right: 0; top: 46%;
  text-align: center;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(200,208,216,0.45);
  pointer-events: none;
  animation: floatHint 2.4s ease-in-out infinite;
}
.hint svg { display: block; margin: 0 auto 6px; width: 16px; height: 16px; opacity: 0.6; }
@keyframes floatHint {
  0%, 100% { transform: translateY(0); opacity: 0.45; }
  50% { transform: translateY(-6px); opacity: 0.75; }
}
.phone.is-scrolled .hint { opacity: 0; animation: none; }

/* YouTube story card */
.yt-story {
  background:
    radial-gradient(ellipse 80% 50% at 50% 20%, rgba(126,200,255,0.12), transparent 60%),
    linear-gradient(180deg, #0e1218 0%, #07090c 100%);
  display: flex; flex-direction: column;
  justify-content: flex-end;
}
.yt-card {
  margin: 0 16px calc(24px + var(--safe-b));
  padding: 22px 20px;
  border-radius: 20px;
  background: rgba(18,22,28,0.92);
  border: 1px solid rgba(200,208,216,0.12);
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  display: flex; flex-direction: column; gap: 16px;
}
.yt-head {
  display: flex; gap: 14px; align-items: center;
}
.yt-head img {
  width: 64px; height: 64px; border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(126,200,255,0.45);
}
.yt-head h2 {
  font-size: 18px; letter-spacing: -0.01em; margin-bottom: 4px;
}
.yt-head p {
  font-size: 12px; color: var(--silver-dim); letter-spacing: 0.04em;
}
.yt-body {
  font-size: 14px; line-height: 1.45; color: var(--silver-dim);
}
.yt-actions { display: flex; gap: 10px; }
.yt-actions .btn-primary { background: #ff0033; color: #fff; box-shadow: none; }
.yt-actions .btn-primary:hover { background: #ff3355; }

.tap-zones {
  position: absolute; inset: 0; z-index: 8;
  display: grid; grid-template-columns: 1fr 1fr;
  pointer-events: none;
}
.tap-zones button {
  pointer-events: auto;
  opacity: 0;
}

@media (min-width: 700px) {
  body { display: flex; align-items: center; justify-content: center; background: #040506; }
  .phone {
    height: min(844px, 96svh);
    width: 390px;
    border-radius: 28px;
    box-shadow: 0 0 0 1px rgba(200,208,216,0.08), 0 30px 80px rgba(0,0,0,0.55);
  }
  .story, .stack { height: 100%; }
  .story { height: 100%; min-height: 100%; }
}
</style>
</head>
<body>
  <div class="phone" id="phone">
    <header class="topbar">
      <p class="mark">MULTI<span>VERSAL</span></p>
      <p class="promise">A named voice you put on Grok.</p>
    </header>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <div class="stack" id="stack" role="region" aria-label="Voice stories">
      <!-- stories injected -->
    </div>

    <p class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      Swipe up · next voice
    </p>
  </div>

<script>
(function () {
  var voices = [
    { name: 'Einstein', file: 'einstein.webp', tone: 'Precise, curious, slightly amused.', kicker: 'Voice 01' },
    { name: 'Elsa', file: 'elsa.webp', tone: 'Calm, crystalline counsel.', kicker: 'Voice 02' },
    { name: 'Keanu', file: 'keanu.webp', tone: 'Grounded. Quiet intensity.', kicker: 'Voice 03' },
    { name: 'Plato', file: 'plato.webp', tone: 'Socratic clarity for hard questions.', kicker: 'Voice 04' },
    { name: 'Murray', file: 'murray.webp', tone: 'Dry wit. Zero fluff.', kicker: 'Voice 05' },
    { name: 'Freeman', file: 'freeman.webp', tone: 'Measured gravitas.', kicker: 'Voice 06' }
  ];

  var stack = document.getElementById('stack');
  var progress = document.getElementById('progress');
  var phone = document.getElementById('phone');
  var hint = document.getElementById('hint');
  var total = voices.length + 1; // + YouTube card

  voices.forEach(function (v, i) {
    var el = document.createElement('article');
    el.className = 'story';
    el.dataset.index = String(i);
    el.innerHTML =
      '<img class="face" src="assets/' + v.file + '" alt="' + v.name + ' voice" loading="' + (i === 0 ? 'eager' : 'lazy') + '">' +
      '<div class="veil" aria-hidden="true"></div>' +
      '<div class="grain" aria-hidden="true"></div>' +
      '<div class="story-body">' +
        '<p class="kicker">' + v.kicker + ' · named voice</p>' +
        '<h1>' + v.name + '</h1>' +
        '<p class="tone">' + v.tone + '</p>' +
        '<div class="cta-row">' +
          '<button class="btn btn-primary" type="button" data-cta="' + v.name + '">Put on Grok</button>' +
          '<button class="btn btn-ghost" type="button" aria-label="Preview">Listen</button>' +
        '</div>' +
      '</div>';
    stack.appendChild(el);

    var bar = document.createElement('i');
    if (i === 0) bar.className = 'active';
    progress.appendChild(bar);
  });

  // YouTube as later story
  var yt = document.createElement('article');
  yt.className = 'story yt-story';
  yt.dataset.index = String(voices.length);
  yt.innerHTML =
    '<div class="story-body" style="padding:0; inset:auto; position:static; height:100%; display:flex; flex-direction:column; justify-content:flex-end;">' +
      '<div class="yt-card">' +
        '<div class="yt-head">' +
          '<img src="assets/yt-avatar.png" alt="Multiversal AI" width="64" height="64">' +
          '<div><h2>Multiversal AI</h2><p>YouTube · @multiversalbots</p></div>' +
        '</div>' +
        '<p class="yt-body">Short cuts of named voices. Product proof — not a trailer reel of “infinite possibilities.”</p>' +
        '<div class="yt-actions">' +
          '<a class="btn btn-primary" href="https://www.youtube.com/@multiversalbots" target="_blank" rel="noopener">Open channel</a>' +
          '<button class="btn btn-ghost" type="button" id="backTop">Back to voices</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  stack.appendChild(yt);
  var ytBar = document.createElement('i');
  progress.appendChild(ytBar);

  var bars = progress.querySelectorAll('i');

  function updateProgress() {
    var h = stack.clientHeight || 1;
    var idx = Math.round(stack.scrollTop / h);
    idx = Math.max(0, Math.min(total - 1, idx));
    bars.forEach(function (b, i) {
      b.className = i < idx ? 'done' : (i === idx ? 'active' : '');
    });
    if (idx > 0) phone.classList.add('is-scrolled');
  }

  stack.addEventListener('scroll', function () {
    updateProgress();
    if (stack.scrollTop > 40) hint.style.opacity = '0';
  }, { passive: true });

  document.getElementById('backTop').addEventListener('click', function () {
    stack.scrollTo({ top: 0, behavior: 'smooth' });
  });

  stack.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-cta]');
    if (!btn) return;
    btn.textContent = 'On Grok ✓';
    btn.style.background = '#9ad6ff';
    setTimeout(function () { btn.textContent = 'Put on Grok'; btn.style.background = ''; }, 1400);
  });

  // keyboard for desktop preview
  window.addEventListener('keydown', function (e) {
    var h = stack.clientHeight;
    if (e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      stack.scrollBy({ top: h, behavior: 'smooth' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      stack.scrollBy({ top: -h, behavior: 'smooth' });
    }
  });

  updateProgress();
})();
</script>
</body>
</html>
