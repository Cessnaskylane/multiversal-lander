<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 07 Mist hero</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:200;color:#3A4550}
  .wash{position:absolute;inset:0}
  .wash img{width:100%;height:100%;object-fit:cover;object-position:center 25%;filter:saturate(.35) brightness(1.25) contrast(.9);opacity:.55}
  .mist{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(236,240,244,.85) 0%,rgba(236,240,244,.45) 45%,rgba(220,226,234,.7) 100%),
    radial-gradient(ellipse 70% 50% at 60% 40%, rgba(255,255,255,.6), transparent)}
  .hero{position:relative;z-index:2;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:0 10%}
  .word{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(64px,11vw,140px);line-height:.92;letter-spacing:-.03em;color:rgba(50,60,70,.28);margin-bottom:8px}
  .line{font-size:clamp(18px,2vw,24px);font-weight:200;color:#4A5560;max-width:420px;line-height:1.4;margin-top:12px}
  .cta{margin-top:56px;font-size:9px;letter-spacing:.4em;text-transform:uppercase;opacity:.4;width:fit-content}
</style>
</head>
<body>
<div class="wash"><img src="../assets/sydney.webp" alt=""></div>
<div class="mist"></div>
<div class="hero">
  <div class="word">Multiversal</div>
  <p class="line">Mist instead of borders.<br>Atmosphere instead of chrome.</p>
  <div class="cta">Enter →</div>
</div>
</body>
</html>
