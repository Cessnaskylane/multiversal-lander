<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 10 Editorial frost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#3A4550;background:#EEF1F4}
  .spread{display:grid;grid-template-columns:1fr 1fr;height:100vh;height:100dvh}
  .type{padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(165deg,#F4F6F8,#E6EAEF)}
  .mark{font-size:11px;letter-spacing:.48em;text-transform:uppercase;color:#8A949E}
  .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;margin-bottom:20px}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(40px,4.8vw,58px);line-height:1.08;color:#2C3640;letter-spacing:-.02em;max-width:420px}
  .sub{margin-top:24px;font-size:14px;line-height:1.65;opacity:.62;max-width:300px;font-weight:300}
  .cta{font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.48}
  .frame-wrap{display:flex;align-items:center;justify-content:center;padding:48px;background:#E8ECF1}
  .frame{width:100%;height:100%;max-height:640px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:18px solid #fff;border-radius:2px;overflow:hidden;box-shadow:0 24px 60px rgba(70,90,110,.1);position:relative}
  .frame img{width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:saturate(.58) brightness(1.05)}
  .frame::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 30%,rgba(230,234,239,.2));pointer-events:none}
</style>
</head>
<body>
<div class="spread">
  <div class="type">
    <div class="mark">MULTIVERSAL</div>
    <div>
      <div class="kicker">Editorial No. 10</div>
      <h1>Magazine glass.<br>Ice on the left.<br>Frost on the right.</h1>
      <p class="sub">Serif authority meets translucent portrait — couture spread, not product UI.</p>
    </div>
    <div class="cta">Turn the page →</div>
  </div>
  <div class="frame-wrap">
    <div class="frame"><img src="../assets/zendaya.webp" alt=""></div>
  </div>
</div>
</body>
</html>
