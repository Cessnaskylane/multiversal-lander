<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 02 Full-bleed frost</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#3E4A54}
  .photo{position:absolute;inset:0}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:saturate(.55) brightness(1.12) contrast(.95)}
  .frost{position:absolute;inset:0;background:rgba(236,240,244,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  .center{position:relative;z-index:2;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .mark{font-size:12px;letter-spacing:.55em;text-transform:uppercase;color:#7A8692;margin-bottom:28px}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(42px,5.5vw,68px);line-height:1.08;color:#2F3A44;letter-spacing:-.02em;max-width:720px}
  .sub{margin-top:24px;font-size:14px;opacity:.62;max-width:360px;line-height:1.6}
  .cta{margin-top:48px;font-size:10px;letter-spacing:.36em;text-transform:uppercase;opacity:.48}
</style>
</head>
<body>
<div class="photo"><img src="../assets/companion.webp" alt=""></div>
<div class="frost"></div>
<div class="center">
  <div class="mark">M U L T I V E R S A L</div>
  <h1>Quiet as frost.<br>Clear as glass.</h1>
  <p class="sub">One translucent sheet. Type floats. No panels to hide behind.</p>
  <div class="cta">Enter the runway →</div>
</div>
</body>
</html>
