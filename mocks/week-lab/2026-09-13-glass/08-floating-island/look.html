<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 08 Floating island</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#4A5560;background:#E8ECF1}
  .field{position:absolute;inset:0;background:
    radial-gradient(ellipse 90% 70% at 50% 100%, #D0D7E0, transparent 55%),
    linear-gradient(180deg,#F0F3F6 0%,#E4E9EE 60%,#D8DEE6 100%)}
  .nav{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:36px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.4;z-index:2}
  .page{position:relative;height:100vh;height:100dvh;display:flex;justify-content:center;padding-top:11vh}
  .island{width:min(720px,78vw);background:rgba(255,255,255,.5);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.7);border-radius:28px;padding:36px 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;box-shadow:0 40px 100px rgba(70,90,110,.12)}
  .mark{font-size:10px;letter-spacing:.45em;text-transform:uppercase;color:#8A949E;margin-bottom:18px}
  h1{font-weight:200;font-size:clamp(26px,3vw,34px);line-height:1.2;color:#343E48;letter-spacing:-.01em}
  .sub{margin-top:14px;font-size:13px;opacity:.65;line-height:1.55;max-width:280px}
  .cta{margin-top:28px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.5}
  .thumb{height:200px;border-radius:18px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:center 15%;filter:saturate(.6) brightness(1.05)}
</style>
</head>
<body>
<div class="field"></div>
<div class="page">
  <div class="island">
    <div>
      <div class="mark">MULTIVERSAL</div>
      <h1>One island of frost<br>on an empty ice field.</h1>
      <p class="sub">Float upper-third. Leave the rest to quiet air.</p>
      <div class="cta">Enter →</div>
    </div>
    <div class="thumb"><img src="../assets/barbie.webp" alt=""></div>
  </div>
</div>
<nav class="nav"><span>Voices</span><span>Runway</span><span>Enter</span></nav>
</body>
</html>
