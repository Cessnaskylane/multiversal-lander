<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 01 Original Plus</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#E8ECF1;color:#5A6570;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;font-weight:300}
  .bg{position:absolute;inset:0;background:
    radial-gradient(ellipse 65% 55% at 68% 38%, rgba(255,255,255,.75), transparent 62%),
    linear-gradient(145deg,#E8ECF1,#D8DEE6 48%,#F0F3F6)}
  .page{position:relative;height:100vh;height:100dvh;display:grid;place-items:center;padding:48px}
  .panel{width:min(1000px,90vw);height:min(600px,74vh);background:rgba(255,255,255,.42);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.62);border-radius:32px;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden;box-shadow:0 36px 90px rgba(70,90,110,.10)}
  .copy{padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{font-size:11px;letter-spacing:.48em;text-transform:uppercase;font-weight:300;color:#8A949E}
  h1{font-weight:200;font-size:clamp(30px,3.6vw,44px);line-height:1.18;color:#364049;letter-spacing:-.015em;max-width:380px}
  .sub{font-size:13.5px;line-height:1.65;opacity:.68;max-width:300px;margin-top:20px}
  .cta{font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.5;border-bottom:1px solid rgba(90,101,112,.25);padding-bottom:6px;width:fit-content}
  .photo{position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;opacity:.9;filter:saturate(.65) brightness(1.06)}
  .photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(232,236,241,.4),transparent 38%);z-index:1}
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="panel">
    <div class="copy">
      <div class="mark">M U L T I V E R S A L</div>
      <div>
        <h1>Almost invisible UI.<br>Almost couture silence.</h1>
        <p class="sub">Pale ice. Translucent panels. A named voice you put on Grok — without the chrome.</p>
      </div>
      <div class="cta">Enter →</div>
    </div>
    <div class="photo"><img src="../assets/elsa.webp" alt=""></div>
  </div>
</div>
</body>
</html>
