<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 05 Runway strip</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=Syne:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:200;color:#3A4550;background:#E2E7ED}
  .stage{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .word{font-family:Syne,sans-serif;font-weight:300;font-size:clamp(28px,5.2vw,72px);letter-spacing:.52em;text-transform:uppercase;color:#5A6570;margin-bottom:36px;padding-left:.52em}
  .strip{width:100%;height:72px;background:rgba(255,255,255,.5);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:space-between;padding:0 8%;box-shadow:0 18px 50px rgba(70,90,110,.08);z-index:3}
  .strip span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .strip .cta{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.6}
  .face{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(380px,36vw);height:42vh;overflow:hidden;z-index:1}
  .face img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(.55) brightness(1.1);opacity:.88;mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent)}
  .ice{position:absolute;inset:0;background:
    radial-gradient(ellipse 50% 40% at 50% 70%, rgba(255,255,255,.5), transparent 70%),
    linear-gradient(180deg,#E8ECF1,#D5DCE4);z-index:0}
</style>
</head>
<body>
<div class="ice"></div>
<div class="stage">
  <div class="word">MULTIVERSAL</div>
  <div class="strip">
    <span>Pale ice · Named voice</span>
    <span class="cta">Enter →</span>
  </div>
  <div class="face"><img src="../assets/elsa.webp" alt=""></div>
</div>
</body>
</html>
