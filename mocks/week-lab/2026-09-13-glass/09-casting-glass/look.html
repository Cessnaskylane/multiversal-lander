<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 09 Casting glass</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#45505A;background:#E6EAEF}
  .bg{position:absolute;inset:0;background:linear-gradient(160deg,#E8ECF1,#D6DCE4 50%,#EEF1F5)}
  .page{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:40px 48px 48px}
  .header{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:22px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 40px rgba(70,90,110,.06)}
  .mark{font-weight:300;font-size:13px;letter-spacing:.4em;text-transform:uppercase;color:#5A6570}
  .meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.5}
  .board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:28px;align-content:center}
  .tile{aspect-ratio:3/4;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 16px 40px rgba(70,90,110,.07)}
  .tile img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(.55) brightness(1.06);opacity:.9}
  .tile .glaze{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 35%,rgba(230,234,239,.28));pointer-events:none}
  .tile .name{position:absolute;bottom:14px;left:16px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35);opacity:.85;z-index:1}
  .foot{margin-top:24px;font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.4;text-align:center}
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <header class="header">
    <div class="mark">MULTIVERSAL</div>
    <div class="meta">Casting through glass</div>
  </header>
  <div class="board">
    <div class="tile"><img src="../assets/elsa.webp" alt=""><div class="glaze"></div><div class="name">Elsa</div></div>
    <div class="tile"><img src="../assets/keanu.webp" alt=""><div class="glaze"></div><div class="name">Keanu</div></div>
    <div class="tile"><img src="../assets/joan.webp" alt=""><div class="glaze"></div><div class="name">Joan</div></div>
    <div class="tile"><img src="../assets/editor.webp" alt=""><div class="glaze"></div><div class="name">Editor</div></div>
  </div>
  <div class="foot">Agency board · Put on Grok →</div>
</div>
</body>
</html>
