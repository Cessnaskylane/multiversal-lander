<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway 03 Vertical ribbon</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=Syne:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#4A5560;background:#E4E9EE}
  .stage{display:grid;grid-template-columns:320px 1fr;height:100vh;height:100dvh}
  .ribbon{background:rgba(255,255,255,.48);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-right:1px solid rgba(255,255,255,.7);padding:48px 36px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:12px 0 60px rgba(80,100,120,.06)}
  .mark{font-family:Syne,sans-serif;font-weight:300;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#8A949E}
  h1{font-weight:200;font-size:32px;line-height:1.2;color:#343E48;letter-spacing:-.01em}
  .voices{list-style:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;line-height:2.2}
  .cta{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.5}
  .field{position:relative;background:linear-gradient(160deg,#E4E9EE,#D0D7E0)}
  .field img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.92;filter:saturate(.6) brightness(1.04)}
  .field::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(228,233,238,.55),transparent 35%)}
</style>
</head>
<body>
<div class="stage">
  <aside class="ribbon">
    <div class="mark">MULTIVERSAL</div>
    <div>
      <h1>A tall glass<br>column of<br>quiet voices.</h1>
      <ul class="voices" style="margin-top:36px">
        <li>Elsa</li><li>Keanu</li><li>Freeman</li><li>Muse</li>
      </ul>
    </div>
    <div class="cta">Begin →</div>
  </aside>
  <div class="field"><img src="../assets/keanu.webp" alt=""></div>
</div>
</body>
</html>
