<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiversal — Look A · Door corridor + YouTube stage</title>
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url(assets/syne-latin-700.woff2) format('woff2');
}
:root {
  --bg: #050508;
  --text: #ece8ef;
  --muted: rgba(236,232,239,0.48);
  --line: #e83d9a;
  --panel: rgba(12,12,18,0.72);
  --door: #0c0c12;
  --m:#ff006e; --u:#fb5607; --l:#ffbe0b; --t:#8338ec; --i:#3a86ff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }

.frame {
  position: relative;
  width: 100%;
  height: 100svh; height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

/* ambient corridor depth */
.amb {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 55% 40% at 50% 48%, rgba(232,61,154,0.08), transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(58,134,255,0.06), transparent 55%),
    linear-gradient(180deg, #050508 0%, #08080e 45%, #050508 100%);
}
.amb::before {
  content: "";
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 96px, rgba(255,255,255,0.015) 96px 97px),
    linear-gradient(90deg, #000 0%, transparent 18%, transparent 82%, #000 100%);
  opacity: 0.7;
}
.pink-rail {
  position: absolute; left: 0; right: 0; top: 52%;
  height: 1px; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  box-shadow: 0 0 18px rgba(232,61,154,0.45);
  opacity: 0.55;
}

/* HUD header */
.hud {
  position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px 8px;
  gap: 16px;
}
.mark {
  margin: 0;
  font-size: clamp(15px, 2vw, 18px);
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  line-height: 1;
}
.mark .m{color:var(--m)}.mark .u{color:var(--u)}.mark .l{color:var(--l)}
.mark .t{color:var(--t)}.mark .i{color:var(--i)}
.mark .versal{color:#fff; letter-spacing:0.16em}
.mark .dot{color:var(--line); letter-spacing:0.06em; text-transform:none; font-size:0.92em}
.promise {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.hud-meta {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.hud-meta .pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line);
  box-shadow: 0 0 10px var(--line);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* stage */
.stage {
  position: relative; z-index: 3;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 28px;
  align-items: center;
  padding: 8px 28px 12px;
  min-height: 0;
}
@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; gap: 18px; padding: 4px 16px; }
  .promise { display: none; }
  .corridor { min-height: 280px; }
}

/* door corridor */
.corridor {
  position: relative;
  height: min(58vh, 520px);
  perspective: 1200px;
  display: flex; align-items: flex-end; justify-content: center;
}
.corridor-track {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 10px;
}
.door {
  position: relative;
  flex: 0 0 auto;
  width: clamp(72px, 9vw, 110px);
  height: 72%;
  border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, #16161f 0%, #0a0a10 100%);
  border: 1px solid rgba(255,255,255,0.06);
  overflow: hidden;
  transform-origin: 50% 100%;
  transition: transform 0.45s cubic-bezier(.2,.8,.2,1), border-color 0.3s, box-shadow 0.3s, width 0.45s, height 0.45s;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
}
.door::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 35%, rgba(0,0,0,0.55));
  pointer-events: none; z-index: 2;
}
.door img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
  filter: grayscale(0.35) brightness(0.72) contrast(1.05);
  transition: filter 0.4s, transform 0.6s;
}
.door .label {
  position: absolute; left: 0; right: 0; bottom: 10px;
  z-index: 3; text-align: center;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  text-shadow: 0 1px 8px #000;
  transition: color 0.3s;
}
.door .jamb {
  position: absolute; inset: 6px;
  border: 1px solid rgba(232,61,154,0);
  border-radius: 6px;
  z-index: 3; pointer-events: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.door:hover, .door:focus-visible {
  transform: translateY(-10px) scale(1.04);
  border-color: rgba(232,61,154,0.35);
  outline: none;
}
.door:hover img, .door:focus-visible img {
  filter: grayscale(0.1) brightness(0.9);
  transform: scale(1.06);
}
.door:hover .label, .door:focus-visible .label { color: #fff; }
.door:hover .jamb, .door:focus-visible .jamb {
  border-color: rgba(232,61,154,0.55);
  box-shadow: 0 0 20px rgba(232,61,154,0.2);
}
.door.is-open {
  width: clamp(160px, 22vw, 260px);
  height: 92%;
  border-color: rgba(232,61,154,0.65);
  box-shadow:
    0 0 0 1px rgba(232,61,154,0.25),
    0 20px 60px rgba(0,0,0,0.55),
    0 0 40px rgba(232,61,154,0.18);
  z-index: 4;
  transform: translateY(-6px);
}
.door.is-open img {
  filter: none;
  transform: scale(1.02);
}
.door.is-open .label {
  color: #fff; font-size: 11px; letter-spacing: 0.24em; bottom: 14px;
}
.door.is-open .jamb {
  border-color: rgba(232,61,154,0.7);
  box-shadow: inset 0 0 30px rgba(232,61,154,0.12);
}
.door.is-open::after {
  content: "";
  position: absolute; left: 12%; right: 12%; bottom: -1px; height: 2px;
  background: var(--line);
  box-shadow: 0 0 16px var(--line);
  z-index: 4;
}
/* depth stagger */
.door:nth-child(1) { height: 58%; opacity: 0.55; transform: translateZ(-80px) scale(0.92); }
.door:nth-child(2) { height: 64%; opacity: 0.7; }
.door:nth-child(3) { height: 70%; }
.door:nth-child(5) { height: 70%; }
.door:nth-child(6) { height: 64%; opacity: 0.7; }
.door:nth-child(7) { height: 58%; opacity: 0.55; transform: translateZ(-80px) scale(0.92); }
.door.is-open:nth-child(n) { opacity: 1; height: 92%; transform: translateY(-6px) translateZ(0) scale(1); }

/* primary portrait panel */
.portrait-panel {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #0a0a10;
  border: 1px solid rgba(255,255,255,0.07);
  min-height: min(52vh, 460px);
  display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.45);
}
.portrait-panel .frame-line {
  position: absolute; left: 14px; right: 14px; top: 14px; bottom: 14px;
  border: 1px solid rgba(232,61,154,0.25);
  border-radius: 10px; pointer-events: none; z-index: 3;
}
.portrait-media {
  position: relative; flex: 1; min-height: 280px; overflow: hidden;
}
.portrait-media img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 18%;
  transition: opacity 0.45s ease, transform 0.8s ease;
}
.portrait-media .veil {
  position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(180deg, transparent 35%, rgba(5,5,8,0.92) 100%),
    radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(5,5,8,0.35) 100%);
}
.portrait-copy {
  position: relative; z-index: 2;
  margin-top: -88px;
  padding: 0 22px 22px;
}
.portrait-copy .kicker {
  margin: 0 0 6px;
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--line);
}
.portrait-copy h1 {
  margin: 0 0 8px;
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 700; letter-spacing: 0.04em;
}
.portrait-copy p {
  margin: 0 0 16px;
  font-size: 13px; line-height: 1.45;
  color: var(--muted); max-width: 34ch;
  font-weight: 500; letter-spacing: 0.01em;
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
}
.cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 16px;
  border-radius: 999px;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  transition: transform 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
}
.btn-primary {
  background: var(--line); color: #12010a;
  box-shadow: 0 0 24px rgba(232,61,154,0.35);
}
.btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
.btn-ghost {
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.78);
  background: rgba(255,255,255,0.03);
}
.btn-ghost:hover { border-color: rgba(232,61,154,0.5); color: #fff; }

/* YouTube stage strip — first-class surface */
.yt-stage {
  position: relative; z-index: 6;
  margin: 0 28px 22px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px; align-items: center;
  border-radius: 14px;
  background: linear-gradient(90deg, rgba(18,18,26,0.95), rgba(12,12,18,0.88));
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 0 1px rgba(232,61,154,0.08),
    0 12px 40px rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
}
.yt-stage:hover { border-color: rgba(232,61,154,0.35); }
.yt-avatar {
  width: 56px; height: 56px; border-radius: 12px;
  object-fit: cover;
  border: 1px solid rgba(232,61,154,0.4);
  box-shadow: 0 0 20px rgba(232,61,154,0.2);
}
.yt-copy { min-width: 0; }
.yt-copy .eyebrow {
  margin: 0 0 3px;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--line);
}
.yt-copy h2 {
  margin: 0 0 2px;
  font-size: 15px; letter-spacing: 0.04em;
}
.yt-copy p {
  margin: 0;
  font-size: 12px; color: var(--muted);
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.yt-actions { display: flex; gap: 8px; align-items: center; }
.yt-play {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-radius: 999px;
  background: #ff0033; color: #fff;
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  transition: transform 0.2s, filter 0.2s;
}
.yt-play:hover { transform: translateY(-1px); filter: brightness(1.08); }
.yt-play svg { width: 12px; height: 12px; fill: currentColor; }
.mini-player {
  display: none;
  width: 160px; height: 90px;
  border-radius: 8px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  background: #111;
  position: relative;
}
.mini-player img {
  width: 100%; height: 100%; object-fit: cover; opacity: 0.85;
}
.mini-player .badge {
  position: absolute; left: 8px; bottom: 8px;
  font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
  background: rgba(0,0,0,0.7); padding: 3px 6px; border-radius: 4px;
  color: #fff;
}
@media (min-width: 900px) {
  .yt-stage { grid-template-columns: auto auto 1fr auto; }
  .mini-player { display: block; }
}
@media (max-width: 700px) {
  .hud { padding: 14px 16px 4px; }
  .yt-stage { margin: 0 12px 14px; grid-template-columns: auto 1fr; }
  .yt-actions { grid-column: 1 / -1; }
  .yt-play { width: 100%; justify-content: center; }
}

.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>
<body>
  <div class="frame">
    <div class="amb" aria-hidden="true"></div>
    <div class="pink-rail" aria-hidden="true"></div>

    <header class="hud">
      <p class="mark" aria-label="Multiversal.ai">
        <span class="m">M</span><span class="u">U</span><span class="l">L</span><span class="t">T</span><span class="i">I</span><span class="versal">VERSAL</span><span class="dot">.ai</span>
      </p>
      <p class="promise">A named voice you put on Grok.</p>
      <div class="hud-meta">
        <span class="pulse" aria-hidden="true"></span>
        <span>Corridor · 7 voices</span>
      </div>
    </header>

    <main class="stage">
      <section class="corridor" aria-label="Named voice doors">
        <div class="corridor-track" id="doors">
          <button class="door" type="button" data-name="Plato" data-file="plato.webp" data-line="Socratic clarity for hard questions.">
            <img src="assets/plato.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Plato</span>
          </button>
          <button class="door" type="button" data-name="Elsa" data-file="elsa.webp" data-line="Calm, crystalline counsel.">
            <img src="assets/elsa.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Elsa</span>
          </button>
          <button class="door" type="button" data-name="Murray" data-file="murray.webp" data-line="Dry wit. Zero fluff.">
            <img src="assets/murray.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Murray</span>
          </button>
          <button class="door is-open" type="button" data-name="Einstein" data-file="einstein.webp" data-line="Precise, curious, slightly amused." aria-pressed="true">
            <img src="assets/einstein.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Einstein</span>
          </button>
          <button class="door" type="button" data-name="Keanu" data-file="keanu.webp" data-line="Grounded. Quiet intensity.">
            <img src="assets/keanu.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Keanu</span>
          </button>
          <button class="door" type="button" data-name="Freeman" data-file="freeman.webp" data-line="Measured gravitas.">
            <img src="assets/freeman.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Freeman</span>
          </button>
          <button class="door" type="button" data-name="Muse" data-file="muse.webp" data-line="Creative pressure, soft edges.">
            <img src="assets/muse.webp" alt="" loading="eager"><span class="jamb"></span><span class="label">Muse</span>
          </button>
        </div>
      </section>

      <aside class="portrait-panel" aria-live="polite">
        <div class="frame-line" aria-hidden="true"></div>
        <div class="portrait-media">
          <img id="heroFace" src="assets/einstein.webp" alt="Einstein voice portrait">
          <div class="veil" aria-hidden="true"></div>
        </div>
        <div class="portrait-copy">
          <p class="kicker">Primary door · open</p>
          <h1 id="heroName">Einstein</h1>
          <p id="heroLine">Precise, curious, slightly amused.</p>
          <div class="cta-row">
            <button class="btn btn-primary" type="button">Put on Grok</button>
            <button class="btn btn-ghost" type="button">Preview tone</button>
          </div>
        </div>
      </aside>
    </main>

    <a class="yt-stage" href="https://www.youtube.com/@multiversalbots" target="_blank" rel="noopener" aria-label="Watch Multiversal AI on YouTube">
      <img class="yt-avatar" src="assets/yt-avatar.png" alt="Multiversal AI channel avatar" width="56" height="56">
      <div class="mini-player" aria-hidden="true">
        <img src="assets/yt-avatar.png" alt="">
        <span class="badge">Live cut</span>
      </div>
      <div class="yt-copy">
        <p class="eyebrow">YouTube · first surface</p>
        <h2>Watch Multiversal AI</h2>
        <p>@multiversalbots — named voices, short cuts, product proof.</p>
      </div>
      <div class="yt-actions">
        <span class="yt-play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          Open channel
        </span>
      </div>
    </a>
  </div>

<script>
(function () {
  var doors = document.querySelectorAll('#doors .door');
  var heroFace = document.getElementById('heroFace');
  var heroName = document.getElementById('heroName');
  var heroLine = document.getElementById('heroLine');

  function openDoor(btn) {
    doors.forEach(function (d) {
      d.classList.remove('is-open');
      d.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('is-open');
    btn.setAttribute('aria-pressed', 'true');
    var name = btn.getAttribute('data-name');
    var file = btn.getAttribute('data-file');
    var line = btn.getAttribute('data-line');
    heroFace.style.opacity = '0';
    heroFace.style.transform = 'scale(1.04)';
    setTimeout(function () {
      heroFace.src = 'assets/' + file;
      heroFace.alt = name + ' voice portrait';
      heroName.textContent = name;
      heroLine.textContent = line;
      heroFace.style.opacity = '1';
      heroFace.style.transform = 'scale(1)';
    }, 180);
  }

  doors.forEach(function (btn) {
    btn.addEventListener('click', function () { openDoor(btn); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDoor(btn); }
    });
  });
})();
</script>
</body>
</html>
