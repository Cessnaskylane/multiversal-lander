<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Soft Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#BFAFA0;color:#2C2620;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .wrap{height:100vh;height:100dvh;padding:28px 32px;display:flex;flex-direction:column;gap:28px}
  header{display:flex;justify-content:space-between;align-items:center}
  .mark{font-size:22px;font-weight:400;letter-spacing:-.02em;text-transform:lowercase}
  .pill{font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:#F5F0E8;padding:8px 14px;border-radius:999px;opacity:.85}
  h1{font-weight:300;font-size:clamp(28px,3.5vw,40px);line-height:1.15;max-width:520px}
  h1 em{font-style:italic}
  .deck{display:flex;gap:18px;flex:1;align-items:stretch;overflow:hidden;padding-bottom:8px}
  .card{flex:1;background:#F5F0E8;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(60,40,20,.12);min-width:0}
  .card .pic{flex:1;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.02)}
  .card .meta{padding:16px 18px 18px}
  .card .name{font-size:13px;letter-spacing:.04em;margin-bottom:4px}
  .card .role{font-size:11px;opacity:.5;letter-spacing:.06em}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.55}
  .cta{background:#2C2620;color:#F5F0E8;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  @media (max-width:700px){
    .wrap{padding:18px 16px;gap:18px}
    .deck{flex-direction:column}
    .card:nth-child(n+3){display:none}
    h1{font-size:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">multiversal</div>
    <div class="pill">Casting deck</div>
  </header>
  <h1>Warm studio light.<br>Personalities like <em>talent cards</em>.</h1>
  <div class="deck">
    <div class="card"><div class="pic"><img src="../../../../assets/scenarios/companion.webp" alt=""></div><div class="meta"><div class="name">Companion</div><div class="role">Soft presence · Put on Grok</div></div></div>
    <div class="card"><div class="pic"><img src="../../../../assets/scenarios/editor.webp" alt=""></div><div class="meta"><div class="name">Editor</div><div class="role">Clean line · Put on Grok</div></div></div>
    <div class="card"><div class="pic"><img src="../../../../assets/scenarios/elsa.webp" alt=""></div><div class="meta"><div class="name">Lead</div><div class="role">Cover energy · Put on Grok</div></div></div>
    <div class="card"><div class="pic"><img src="../../../../assets/scenarios/director.png" alt=""></div><div class="meta"><div class="name">Director</div><div class="role">Quiet command · Put on Grok</div></div></div>
  </div>
  <div class="foot"><span>A named voice. Not a chatbot.</span><button class="cta">Open deck</button></div>
</div>
</body>
</html>
