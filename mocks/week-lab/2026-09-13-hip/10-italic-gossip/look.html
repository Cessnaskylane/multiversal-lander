<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Italic Gossip</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#FFFFFF;color:#121212;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .page{height:100vh;height:100dvh;padding:48px 64px;display:flex;flex-direction:column}
  .logo{font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(42px,6vw,64px);font-weight:400;letter-spacing:-.02em}
  .spacer{flex:1;min-height:40px}
  .invite{max-width:640px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.4;margin-bottom:28px}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:1.25;font-style:normal}
  h1 em{font-style:italic}
  .names{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:14px 48px;max-width:520px}
  .names li{list-style:none;font-family:"Instrument Serif",serif;font-style:italic;font-size:22px;border-bottom:1px solid #EEE;padding-bottom:10px}
  .names li span{display:block;font-family:"DM Sans",sans-serif;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.35;margin-top:4px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:40px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.4}
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid #121212;padding-bottom:2px;opacity:1;color:#121212}
  @media (max-width:700px){
    .page{padding:28px 22px}
    .names{grid-template-columns:1fr;gap:12px;margin-top:32px}
    .names li{font-size:20px}
    .logo{font-size:40px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="logo">Multiversal</div>
  <div class="spacer"></div>
  <div class="invite">
    <div class="kicker">Tonight · Private list</div>
    <h1>A named voice you put on Grok.<br>Feels like a <em>party invite</em>, not a product.</h1>
    <ul class="names">
      <li>Companion<span>Soft presence</span></li>
      <li>Editor<span>Clean line</span></li>
      <li>Director<span>Quiet command</span></li>
      <li>Lead<span>Cover energy</span></li>
      <li>Counsel<span>Late advice</span></li>
      <li>You<span>Put on Grok</span></li>
    </ul>
  </div>
  <div class="foot"><span>multiversal.ai</span><a href="#">RSVP the voice</a></div>
</div>
</body>
</html>
