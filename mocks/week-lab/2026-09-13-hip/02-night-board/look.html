<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Night Board</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#050505;color:#F2F2F2;font-family:Syne,system-ui,sans-serif;overflow:hidden}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:1px solid #222}
  .mark{font-size:13px;font-weight:500;letter-spacing:.32em;text-transform:uppercase}
  .meta{font-family:"DM Sans",sans-serif;font-size:10px;letter-spacing:.16em;opacity:.4;text-transform:uppercase}
  .board{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;grid-template-rows:1.2fr 1fr;gap:6px;padding:6px;height:calc(100vh - 58px);height:calc(100dvh - 58px)}
  .cell{position:relative;overflow:hidden;background:#111}
  .cell img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.92)}
  .cell:nth-child(1){grid-row:1/3}
  .cell:nth-child(4){grid-row:1/3}
  .tag{position:absolute;left:12px;bottom:12px;font-family:"DM Sans",sans-serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
  .rail{position:absolute;right:28px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:10px;letter-spacing:.28em;opacity:.35;text-transform:uppercase;z-index:3;pointer-events:none}
  .footer{position:absolute;left:28px;bottom:22px;z-index:4;font-family:"DM Sans",sans-serif;font-size:11px;letter-spacing:.08em;opacity:.55;max-width:280px}
  .footer strong{display:block;font-family:Syne,sans-serif;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin-bottom:6px;opacity:1;color:#fff}
  @media (max-width:700px){
    .board{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);height:calc(100dvh - 52px)}
    .cell:nth-child(1),.cell:nth-child(4){grid-row:auto}
    .cell:nth-child(5),.cell:nth-child(6){display:none}
    .rail{display:none}
    .footer{left:16px;bottom:16px;right:16px;max-width:none;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:40px 0 0}
  }
</style>
</head>
<body>
<header>
  <div class="mark">Multiversal</div>
  <div class="meta">Board · New York / Paris</div>
</header>
<div class="board">
  <div class="cell"><img src="../../../../assets/scenarios/keanu.webp" alt=""><div class="tag">01 — Lead</div></div>
  <div class="cell"><img src="../../../../assets/scenarios/elsa.webp" alt=""><div class="tag">02</div></div>
  <div class="cell"><img src="../../../../assets/scenarios/editor.webp" alt=""><div class="tag">03</div></div>
  <div class="cell"><img src="../../../../assets/scenarios/freeman.webp" alt=""><div class="tag">04 — Voice</div></div>
  <div class="cell"><img src="../../../../assets/scenarios/companion.webp" alt=""><div class="tag">05</div></div>
  <div class="cell"><img src="../../../../assets/scenarios/barbie.webp" alt=""><div class="tag">06</div></div>
</div>
<div class="rail">A named voice you put on Grok</div>
<div class="footer"><strong>Put on Grok</strong>Elite energy. Asymmetric casting. No glow required.</div>
</body>
</html>
