<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Ivory Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#F4EFE6;color:#111;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .page{display:grid;grid-template-columns:1.05fr 0.95fr;height:100vh;height:100dvh}
  header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:28px 40px}
  .mark{font-family:"Bodoni Moda",serif;font-size:15px;letter-spacing:.28em;font-weight:500}
  .mark span{font-family:"DM Sans",sans-serif;font-size:10px;letter-spacing:.08em;opacity:.45;margin-left:6px}
  .nav{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.4}
  .copy{display:flex;flex-direction:column;justify-content:center;padding:80px 56px 64px;gap:28px}
  h1{font-family:"Bodoni Moda",serif;font-weight:400;font-size:clamp(42px,5.6vw,72px);line-height:.95;letter-spacing:-.01em}
  h1 em{font-style:italic;font-weight:400}
  .sub{font-size:14px;line-height:1.55;max-width:320px;opacity:.55;font-weight:300}
  .cta{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:8px;width:fit-content;margin-top:12px}
  .photo{position:relative;overflow:hidden;background:#ddd}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 18%;filter:contrast(1.05) saturate(.92)}
  .photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 80px rgba(244,239,230,.35);pointer-events:none}
  .cap{position:absolute;bottom:28px;left:28px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:.75;mix-blend-mode:difference}
  @media (max-width:700px){
    .page{grid-template-columns:1fr;grid-template-rows:1.1fr .9fr}
    header{padding:20px 22px}
    .copy{padding:28px 22px 40px;gap:18px}
    h1{font-size:40px}
    .photo{order:-1}
  }
</style>
</head>
<body>
<header>
  <div class="mark">MULTIVERSAL<span>.ai</span></div>
  <div class="nav">Maison</div>
</header>
<div class="page">
  <section class="copy">
    <h1>A named<br>voice you<br><em>put on</em><br>Grok.</h1>
    <p class="sub">Personality as couture. Quiet enough for a model board. Sharp enough for a personal brand.</p>
    <div class="cta">Put on Grok</div>
  </section>
  <section class="photo">
    <img src="../../../../assets/scenarios/elsa.webp" alt="">
    <div class="cap">Editorial 01</div>
  </section>
</div>
</body>
</html>
