<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Gold Quiet</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1C1410;color:#E8DCC8;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .page{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 1.05fr}
  .copy{padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#C8A96B}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(36px,4.8vw,56px);line-height:1.05;max-width:420px}
  h1 em{font-style:italic;color:#C8A96B}
  .sub{font-size:13px;font-weight:300;line-height:1.6;opacity:.55;max-width:300px;margin-top:20px}
  .rule{width:64px;height:1px;background:#C8A96B;margin:28px 0}
  .cta{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C8A96B}
  .photo{position:relative;overflow:hidden;background:#0E0A08}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 15%;filter:saturate(.7) contrast(1.08) brightness(.72)}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1C1410 0%, transparent 28%), linear-gradient(to top, rgba(28,20,16,.5), transparent 40%)}
  .cap{position:absolute;bottom:32px;left:32px;z-index:2;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#C8A96B;opacity:.8}
  @media (max-width:700px){
    .page{grid-template-columns:1fr;grid-template-rows:1fr 1.1fr}
    .copy{padding:28px 22px;order:2}
    .photo{min-height:45vh}
    h1{font-size:36px}
  }
</style>
</head>
<body>
<div class="page">
  <section class="copy">
    <div class="mark">Multiversal</div>
    <div>
      <h1>Quiet wealth.<br>Not <em>crypto</em> gold.</h1>
      <div class="rule"></div>
      <p class="sub">Espresso velvet. Champagne foil. One portrait. A named voice you put on Grok — for people who already have taste.</p>
    </div>
    <div class="cta">Put on Grok</div>
  </section>
  <section class="photo">
    <img src="../../../../assets/scenarios/freeman.webp" alt="">
    <div class="cap">Portrait 09</div>
  </section>
</div>
</body>
</html>
