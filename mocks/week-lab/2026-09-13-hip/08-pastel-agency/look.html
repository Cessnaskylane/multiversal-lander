<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Pastel Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#F7F4FB;color:#2A2A32;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .page{height:100vh;height:100dvh;display:grid;grid-template-columns:280px 1fr}
  aside{background:linear-gradient(180deg,#E8D5F0 0%,#F7F4FB 55%,#D5EDE4 100%);padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(42,42,50,.06)}
  .mono{font-family:"Bodoni Moda",serif;font-size:72px;line-height:1;letter-spacing:-.04em}
  .word{font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin-top:10px;font-weight:500}
  .aside-note{font-size:12px;line-height:1.55;opacity:.55;font-weight:300}
  main{padding:36px 48px;display:flex;flex-direction:column;gap:28px}
  header{display:flex;justify-content:space-between;align-items:center}
  .nav{display:flex;gap:22px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.45}
  h1{font-weight:300;font-size:clamp(32px,4vw,48px);line-height:1.15;max-width:520px;letter-spacing:-.02em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
  .tile{border-radius:18px;overflow:hidden;background:#fff;position:relative;box-shadow:0 10px 30px rgba(80,60,100,.06)}
  .tile img{width:100%;height:100%;object-fit:cover;filter:saturate(.8)}
  .tile .lbl{position:absolute;left:14px;bottom:14px;background:rgba(247,244,251,.9);padding:6px 10px;border-radius:999px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .cta{align-self:flex-start;background:#2A2A32;color:#F7F4FB;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  @media (max-width:700px){
    .page{grid-template-columns:1fr}
    aside{flex-direction:row;align-items:center;gap:16px;padding:18px 20px;border-right:0;border-bottom:1px solid rgba(42,42,50,.06)}
    .mono{font-size:42px}
    .aside-note{display:none}
    main{padding:22px 18px;gap:18px}
    .grid{grid-template-columns:1fr 1fr}
    .tile:nth-child(3){display:none}
  }
</style>
</head>
<body>
<div class="page">
  <aside>
    <div>
      <div class="mono">M.</div>
      <div class="word">Multiversal</div>
    </div>
    <p class="aside-note">Comme / SSENSE adjacent pastel. Agency calm — not babyish.</p>
  </aside>
  <main>
    <header>
      <div class="nav"><span>Talent</span><span>Voices</span><span>Board</span></div>
      <div style="font-size:11px;letter-spacing:.14em;opacity:.4">.AI</div>
    </header>
    <h1>Soft lilac. Mint geometry.<br>A named voice for the house.</h1>
    <div class="grid">
      <div class="tile"><img src="../../../../assets/scenarios/companion.webp" alt=""><div class="lbl">01</div></div>
      <div class="tile"><img src="../../../../assets/scenarios/elsa.webp" alt=""><div class="lbl">02</div></div>
      <div class="tile"><img src="../../../../assets/scenarios/barbie.webp" alt=""><div class="lbl">03</div></div>
    </div>
    <button class="cta">Put on Grok</button>
  </main>
</div>
</body>
</html>
