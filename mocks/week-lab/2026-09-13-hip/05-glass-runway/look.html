<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Glass Runway</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#E6EAEF;color:#5A6570;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;font-weight:300}
  .bg{position:absolute;inset:0;background:
    radial-gradient(ellipse 70% 50% at 70% 40%, rgba(255,255,255,.7), transparent 60%),
    linear-gradient(135deg,#E6EAEF,#D5DCE4 50%,#EEF1F4)}
  .page{position:relative;height:100vh;height:100dvh;display:grid;place-items:center;padding:40px}
  .panel{width:min(980px,92vw);height:min(620px,78vh);background:rgba(255,255,255,.38);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.55);border-radius:28px;display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden;box-shadow:0 30px 80px rgba(80,100,120,.12)}
  .copy{padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{font-size:12px;letter-spacing:.42em;text-transform:uppercase;font-weight:300;color:#7A8692}
  h1{font-weight:200;font-size:clamp(28px,3.4vw,40px);line-height:1.2;color:#3A4550;letter-spacing:-.01em;max-width:360px}
  .sub{font-size:13px;line-height:1.6;opacity:.7;max-width:280px}
  .cta{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.55}
  .photo{position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;opacity:.88;filter:saturate(.7) brightness(1.05)}
  .photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(230,234,239,.35),transparent 40%);z-index:1}
  @media (max-width:700px){
    .page{padding:20px}
    .panel{grid-template-columns:1fr;height:auto;min-height:90vh;border-radius:20px}
    .copy{padding:28px 22px;gap:24px}
    .photo{min-height:42vh}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="panel">
    <div class="copy">
      <div class="mark">M U L T I V E R S A L</div>
      <div>
        <h1>Almost invisible UI.<br>Almost couture silence.</h1>
        <p class="sub" style="margin-top:18px">Pale ice. Translucent panels. A named voice you put on Grok — without the chrome.</p>
      </div>
      <div class="cta">Enter →</div>
    </div>
    <div class="photo"><img src="../../../../assets/scenarios/elsa.webp" alt=""></div>
  </div>
</div>
</body>
</html>
