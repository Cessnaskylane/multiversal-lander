<!DOCTYPE html>
<html lang="en">
<head>

<title>Multiversal — Sunset Cast</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1A0E0C;color:#F7E8D0;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .stage{position:relative;height:100vh;height:100dvh;overflow:hidden}
  .stage img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:sepia(.25) saturate(1.15) contrast(1.05) brightness(.78)}
  .wash{position:absolute;inset:0;background:
    linear-gradient(105deg, rgba(90,30,25,.72) 0%, rgba(140,60,40,.35) 42%, rgba(20,10,8,.55) 100%),

  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,5.5vw,68px);line-height:.95;letter-spacing:-.01em}
  h1 em{font-style:italic}
  .sub{margin-top:18px;font-size:14px;font-weight:300;opacity:.75;max-width:360px;line-height:1.55}
  .row{display:flex;gap:28px;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
  .row .cta{border:1px solid rgba(247,232,208,.55);padding:10px 18px;letter-spacing:.18em}
  @media (max-width:700px){
    .content{padding:22px 20px}
    .center{margin-bottom:24px}
    h1{font-size:42px}
  }
</style>
</head>
<body>
<div class="stage">
  <img src="../../../../assets/scenarios/keanu.webp" alt="">

  <div class="content">
    <div class="mark">Multiversal</div>
    <div class="center">
      <h1>Casting call<br>at <em>dusk.</em></h1>

  </div>

</html>
