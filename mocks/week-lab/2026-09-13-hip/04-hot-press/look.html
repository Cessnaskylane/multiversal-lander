<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiversal — Hot Press</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#F3ECE1;color:#111;font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .page{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 1.05fr}
  .left{padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .date{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#C41E3A}
  .stack{font-family:"Bodoni Moda",serif;font-weight:600;font-size:clamp(64px,9vw,118px);line-height:.82;letter-spacing:-.02em}
  .stack span{display:block}
  .tagline{font-family:"Bodoni Moda",serif;font-style:italic;font-size:22px;margin-top:18px;max-width:280px}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .micro{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;line-height:1.6}
  .cta{color:#C41E3A;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1.5px solid #C41E3A;padding-bottom:4px}
  .right{position:relative;overflow:hidden;background:#222}
  .right img{width:100%;height:100%;object-fit:cover;object-position:center 15%;filter:contrast(1.08) saturate(.9)}
  .badge{position:absolute;top:28px;right:28px;width:72px;height:72px;border-radius:50%;border:1.5px solid #C41E3A;color:#C41E3A;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;line-height:1.3;background:rgba(243,236,225,.92)}
  @media (max-width:700px){
    .page{grid-template-columns:1fr;grid-template-rows:.95fr 1.05fr}
    .left{padding:22px 20px;order:2}
    .stack{font-size:64px}
    .badge{top:16px;right:16px;width:64px;height:64px}
  }
</style>
</head>
<body>
<div class="page">
  <section class="left">
    <div class="date">September 13, 2026  ·  Vol. I No. 04</div>
    <div>
      <div class="stack"><span>MULTI</span><span>VERSAL</span></div>
      <div class="tagline">The cover voice.</div>
    </div>
    <div class="bottom">
      <div class="micro">A named voice<br>you put on Grok<br>multiversal.ai</div>
      <div class="cta">Put on Grok</div>
    </div>
  </section>
  <section class="right">
    <img src="../../../../assets/scenarios/barbie.webp" alt="">
    <div class="badge">Hot<br>Press</div>
  </section>
</div>
</body>
</html>
