<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(https://fonts.gstatic.com/s/syne/v24/8vIS7w4qzmVxsWxjBZRjr0FKM_04uT6k.ttf) format('truetype');
}
@font-face {
  font-family: 'Syne';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(https://fonts.gstatic.com/s/syne/v24/8vIS7w4qzmVxsWxjBZRjr0FKM_0KuT6k.ttf) format('truetype');
}

html, body { margin:0; height:100%; background:#050508; }
.mark {
  position:absolute;
  top:28px; left:28px;
  margin:0;
  font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: clamp(13px, 1.6vw, 18px);
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #f4f0f6;
}
.mark .rest { color: #e83d9a; }
.mark .ai {
  color: #e83d9a;
  letter-spacing: 0.12em;
  text-transform: none;
  font-size: 0.92em;
}
</style>
</head>
<body>
  <p class="mark"><span style="color:#d4d4d8">M</span><span style="color:#fe2c55">U</span><span style="color:#f97316">L</span><span style="color:#f4f4f5">T</span><span style="color:#6366f1">I</span><span class="rest">versal</span> <span class="ai">.ai</span></p>
</body></html>
