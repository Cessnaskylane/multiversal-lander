<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mock — page 2 Albert idea box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --text: #ece8ef;
      --pink: #e83d9a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Syne, "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100svh;
      background: radial-gradient(ellipse 80% 55% at 50% 35%, rgba(80, 40, 90, 0.18), transparent 60%), var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 40px;
    }
    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 50;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      border: 1px solid rgba(232,61,154,0.35);
      padding: 4px 8px;
      border-radius: 999px;
    }
    .mark {
      position: absolute;
      top: 28px;
      left: 28px;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .mark .m1 { color: #e83d9a; }
    .mark .m2 { color: #ff8a3d; }
    .mark .m3 { color: #f5c542; }
    .mark .m4 { color: #a855f7; }
    .mark .m5 { color: #4285f4; }
    .mark .rest { color: #fff; }
    .mark .ai { color: #e83d9a; text-transform: none; letter-spacing: 0; }
    .s2-stack {
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
    }
    .screen-title {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(236,232,239,0.85);
    }
    .stage {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .portrait-wrap {
      width: min(100%, 280px);
      aspect-ratio: 3 / 4;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 0 1px rgba(232,61,154,0.15), 0 20px 50px rgba(0,0,0,0.45);
      background: #111;
    }
    .portrait-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Idea box — left of portrait */
    .idea-box {
      position: absolute;
      left: max(-8px, calc(50% - 280px / 2 - 168px));
      top: 18%;
      width: 148px;
      padding: 12px 12px 14px;
      border-radius: 12px;
      background: rgba(12, 10, 16, 0.92);
      border: 1px solid rgba(232, 61, 154, 0.45);
      box-shadow:
        0 0 18px rgba(232, 61, 154, 0.18),
        inset 0 0 20px rgba(232, 61, 154, 0.06);
      z-index: 5;
    }
    .idea-box::after {
      content: "";
      position: absolute;
      right: -7px;
      top: 28px;
      width: 12px;
      height: 12px;
      background: rgba(12, 10, 16, 0.92);
      border-right: 1px solid rgba(232, 61, 154, 0.45);
      border-top: 1px solid rgba(232, 61, 154, 0.45);
      transform: rotate(45deg);
    }
    .idea-kicker {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 8px;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ff7eb9;
    }
    .idea-kicker .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px rgba(232,61,154,0.8);
      flex: 0 0 auto;
    }
    .idea-box p {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.45;
      letter-spacing: 0.01em;
      color: rgba(236, 232, 239, 0.88);
      font-weight: 400;
    }
    .idea-box a {
      color: #ff7eb9;
      text-decoration: none;
      border-bottom: 1px solid rgba(232,61,154,0.35);
    }
    .chips {
      margin-top: 12px;
      width: min(100%, 280px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font: 500 12px/1 Syne, sans-serif;
    }
    .chip.on {
      border-color: var(--pink);
      box-shadow:
        0 0 10px rgba(232, 61, 154, 0.55),
        0 0 22px rgba(232, 61, 154, 0.35),
        inset 0 0 10px rgba(232, 61, 154, 0.28);
    }
    .chip-label {
      width: 100%;
      text-align: center;
      margin: 0 0 2px;
      font-size: 11px;
      color: rgba(236,232,239,0.5);
      letter-spacing: 0.06em;
    }
    .continue {
      margin-top: 22px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      background: linear-gradient(180deg, #f04aa8, #e83d9a);
      color: #fff;
      font: 600 14px/1 Syne, sans-serif;
      letter-spacing: 0.04em;
    }
    @media (max-width: 720px) {
      .idea-box {
        left: 8px;
        top: 12%;
        width: 132px;
        padding: 10px;
      }
      .idea-box p { font-size: 10.5px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <span class="badge">mock · not live</span>
    <p class="mark" aria-hidden="true">
      <span class="m1">M</span><span class="m2">U</span><span class="m3">L</span><span class="m4">T</span><span class="m5">I</span><span class="rest">VERSAL</span><span class="ai">.ai</span>
    </p>
    <div class="s2-stack">
      <h1 class="screen-title">Your agent</h1>
      <div class="stage">
        <aside class="idea-box" aria-label="Agent intro">
          <p class="idea-kicker"><span class="dot" aria-hidden="true"></span> Idea</p>
          <p>Hi, I'm albert of <a href="#">www.alberteinstein.ai</a>. I'm the default agent for multiversal.ai, but you can swap me for your perfect agent later!</p>
        </aside>
        <div class="portrait-wrap">
          <img src="../assets/agent-face.png?v=3" alt="Albert Einstein agent" />
        </div>
        <div class="chips">
          <p class="chip-label">Choose model</p>
          <button type="button" class="chip on">Grok</button>
          <button type="button" class="chip">GPT</button>
          <button type="button" class="chip">Claude</button>
          <button type="button" class="chip">Gemini</button>
          <button type="button" class="chip">DeepSeek</button>
        </div>
      </div>
      <button type="button" class="continue">Continue</button>
    </div>
  </div>
</body>
</html>
